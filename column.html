<script>
// 筛选 AI 前沿标签的文章
var aiArticles = ARTICLES.filter(function(a){ return a.tags.indexOf('AI前沿') >= 0; });
var aiCount = aiArticles.length;

// 渲染文章列表
function renderColumnArticles(list) {
  var grid = document.getElementById('articleGrid');
  if (!grid) return;
  if (list.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-light)">📝 专栏文章正在路上，敬请期待</div>';
    return;
  }
  grid.innerHTML = list.map(function(a){
    var liked = localStorage.getItem('like_'+a.id) === 'true';
    return '<div class="article-card" onclick="location.href=\'index.html?id='+a.id+'&view=column\'">'+
      '<div class="card-tags">'+a.tags.map(function(t){return '<span class="card-tag">'+t+'</span>';}).join('')+'</div>'+
      '<h2>'+a.title+'</h2>'+
      '<p class="card-excerpt">'+a.excerpt+'</p>'+
      '<div class="card-meta"><span class="date">'+a.date+'</span>'+
      '<span style="display:flex;align-items:center;gap:4px" onclick="event.stopPropagation();colLike(\''+a.id+'\')">'+
      '<span class="like-btn'+(liked?' liked':'')+'" id="colLike_'+a.id+'">'+(liked?'♥':'♡')+'</span></span></div></div>';
  }).join('');
}

// 生成标签筛选按钮
var tagSet = {};
aiArticles.forEach(function(a){ a.tags.forEach(function(t){ tagSet[t] = (tagSet[t]||0)+1; }); });
var tagNames = Object.keys(tagSet).sort();
var tagHtml = '<button class="tag-btn active" data-tag="all">🏷️ 全部</button>';
tagNames.forEach(function(t){
  tagHtml += '<button class="tag-btn" data-tag="'+t+'">'+t+' <span class="count">'+tagSet[t]+'</span></button>';
});
document.getElementById('columnTagFilter').innerHTML = tagHtml;

// 标签点击事件
document.getElementById('columnTagFilter').addEventListener('click', function(e){
  if (e.target.classList.contains('tag-btn')) {
    var tag = e.target.dataset.tag;
    document.querySelectorAll('#columnTagFilter .tag-btn').forEach(function(b){ b.className = 'tag-btn'; });
    e.target.className = 'tag-btn active';
    if (tag === 'all') {
      renderColumnArticles(aiArticles);
    } else {
      renderColumnArticles(aiArticles.filter(function(a){ return a.tags.indexOf(tag) >= 0; }));
    }
  }
});

// 默认渲染全部
renderColumnArticles(aiArticles);
// 点赞
function colLike(id){
  var key = 'like_'+id;
  var liked = localStorage.getItem(key) === 'true';
  if(liked){ localStorage.removeItem(key); } else { localStorage.setItem(key, 'true'); }
  var now = !liked;
  var btn = document.getElementById('colLike_'+id);
  if(btn){ btn.className='like-btn'+(now?' liked':''); btn.textContent=now?'♥':'♡'; }
  if(btn){ btn.style.transform='scale(1.3)'; setTimeout(function(){btn.style.transform='scale(1)';},200); }
}
</script>
