<script>
// ===== marked.js 精简版（仅支持基础 Markdown 语法） =====
// 自实现简易 Markdown 解析器，无需外部库
function simpleMarkdown(text) {
  if (!text) return '';
  var html = text;
  // 转义 HTML 标签
  html = html.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  
  // 代码块 (```) — 去除首尾多余空行
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(m, lang, code) {
    code = code.replace(/^\s+|\s+$/g, '');
    var cls = lang ? ' class="language-'+lang+'"' : '';
    // 每行用 span 包裹，确保行高完全一致
    var lines = code.split('\n');
    for (var i = 0; i < lines.length; i++) {
      lines[i] = '<span class="cl">' + lines[i] + '</span>';
    }
    return '<pre><code'+cls+'>'+lines.join('')+'</code></pre>';
  });
  
  // 行内代码
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  
  // 标题 — 加 id 用于目录锚点
  var slugify = function(t){ return t.replace(/\s+/g,'-').replace(/[^\w\u4e00-\u9fff-]/g,''); };
  html = html.replace(/^#### (.+)$/gm, function(m,t){ return '<h4 id="'+slugify(t)+'">'+t+'</h4>'; });
  html = html.replace(/^### (.+)$/gm, function(m,t){ return '<h3 id="'+slugify(t)+'">'+t+'</h3>'; });
  html = html.replace(/^## (.+)$/gm, function(m,t){ return '<h2 id="'+slugify(t)+'">'+t+'</h2>'; });
  html = html.replace(/^# (.+)$/gm, function(m,t){ return '<h1 id="'+slugify(t)+'">'+t+'</h1>'; });
  
  // 水平线
  html = html.replace(/^---$/gm, '<hr>');
  html = html.replace(/^___$/gm, '<hr>');
  
  // 引用
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  
  // 表格
  html = html.replace(/\|(.+)\|\n\|[-| :]+\|\n((?:\|.+\|\n?)*)/g, function(m, header, rows) {
    var h = header.split('|').map(function(c){return c.trim()}).filter(Boolean);
    var thead = '<tr>'+h.map(function(c){return '<th>'+c+'</th>'}).join('')+'</tr>';
    var tbody = rows.split('\n').filter(function(r){return r.trim()}).map(function(r){
      var c = r.split('|').map(function(x){return x.trim()}).filter(Boolean);
      if(c.length===0) return '';
      return '<tr>'+c.map(function(x){return '<td>'+x+'</td>'}).join('')+'</tr>';
    }).join('');
    return '<table><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table>';
  });
  
  // 加粗 + 斜体
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  
  // 删除线
  html = html.replace(/~~(.+?)~~/g, '<del>$1</del>');
  
  // 图片
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<figure class="article-figure"><img src="$2" alt="$1" class="article-img"><figcaption>$1</figcaption></figure>');
  
  // 链接
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  
  // 无序列表
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, function(m){return '<ul>'+m.replace(/\n/g,'')+'</ul>'});
  
  // 有序列表
  html = html.replace(/^\d+\. (.+)$/gm, '<li value="">$1</li>');
  
  // 段落（包裹未被标签包裹的行）
  var lines = html.split('\n');
  var result = [];
  var inBlock = false;
  var blockTags = ['h1','h2','h3','h4','ul','ol','li','pre','blockquote','table','hr','figure'];
  for(var i=0;i<lines.length;i++){
    var line = lines[i].trim();
    if(!line) { result.push(''); continue; }
    var isBlock = false;
    for(var j=0;j<blockTags.length;j++){
      if(line.indexOf('<'+blockTags[j])===0 || line.indexOf('</'+blockTags[j])===0){
        isBlock=true; break;
      }
    }
    if(isBlock || line.indexOf('<ul>')===0 || line.indexOf('</ul>')===0 || line.indexOf('<ol>')===0){
      result.push(line);
    } else {
      result.push('<p>'+line+'</p>');
    }
  }
  html = result.join('\n');
  
  // 合并连续的 blockquote
  html = html.replace(/<blockquote>([\s\S]*?)<\/blockquote>\n?<blockquote>([\s\S]*?)<\/blockquote>/g,
    '<blockquote>$1\n$2</blockquote>');
  
  return html;
}

var inColumn = false;
var homeArticles = [];


function getParam(name) {

function showHome() {
  inColumn = false;
  homeArticles = ARTICLES.filter(function(a){ return a.tags.indexOf('AI前沿') < 0; });
  document.getElementById('navHome').className = 'active';
  document.getElementById('navColumn').className = '';
  document.getElementById('navAbout').className = '';
  // 清空 URL 参数
  if(history.replaceState){ history.replaceState(null, '', location.pathname); }
  var main = document.getElementById('mainContent');
  main.innerHTML = renderHome();
  // 搜索
  var searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.addEventListener('input', function(){
      var q = this.value.toLowerCase().trim();
      doSearch(q);
    });
  }
  // 绑定标签事件
  document.querySelectorAll('.tag-btn').forEach(function(b){
    b.onclick = function(){ filterTag(b.dataset.tag); };
  });
  // 全部按钮
  var allBtn = document.querySelector('.tag-btn[data-tag="all"]');
  if(allBtn) allBtn.onclick = function(){ renderAll(); };
  renderArticles(homeArticles);
}

function doSearch(q) {
  if(!q) { renderArticles(homeArticles); return; }
  var filtered = homeArticles.filter(function(a){
    return a.title.toLowerCase().indexOf(q)>=0 ||
           a.excerpt.toLowerCase().indexOf(q)>=0 ||
           a.tags.some(function(t){ return t.toLowerCase().indexOf(q)>=0; });
  });
  renderArticles(filtered);
}

function renderHome() {
  var tags = {};
  homeArticles.forEach(function(a){
    a.tags.forEach(function(t){ tags[t] = (tags[t]||0)+1; });
  });

function buildTOC() {
  var sidebar = document.getElementById('tocSidebar');
  if(!sidebar) return;
  var headings = document.querySelectorAll('.article-content h2, .article-content h3');
  if(headings.length < 2) { sidebar.className = 'toc-sidebar'; return; }
  sidebar.className = 'toc-sidebar show';
  var html = '<div class="toc-title">📑 目录</div><nav><ul class="toc-list">';
  headings.forEach(function(h){
    var depth = h.tagName === 'H3' ? 'd3' : '';
    var id = h.id;
    var text = h.textContent;
    html += '<li class="toc-item"><a class="toc-link '+depth+'" href="#'+id+'">'+text+'</a></li>';
  });
  html += '</ul></nav>';
  sidebar.innerHTML = html;
  // 滚动监听高亮
  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        document.querySelectorAll('.toc-link').forEach(function(l){ l.classList.remove('active'); });
        var link = document.querySelector('.toc-link[href="#'+entry.target.id+'"]');
        if(link) link.classList.add('active');
      }
    });
  }, { rootMargin: '-80px 0px -75% 0px' });
  headings.forEach(function(h){ if(h.id) observer.observe(h); });
}

<script>
const c=document.getElementById('particleCanvas'),x=c.getContext('2d');
let W,H,ps=[],m={x:-9999,y:-9999};
const CF={count:120,speed:0.25,cDist:110,mR:160};
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}
class P{
  constructor(){this.rr()}
  rr(){this.x=Math.random()*W;this.y=Math.random()*H;this.vx=(Math.random()-0.5)*CF.speed*2;this.vy=(Math.random()-0.5)*CF.speed*2;this.r=Math.random()*1.8+0.6}
  up(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>W)this.vx*=-1;if(this.y<0||this.y>H)this.vy*=-1}
  dr(){x.beginPath();x.arc(this.x,this.y,this.r,0,Math.PI*2);x.fillStyle='rgba(44,110,73,0.35)';x.fill()}
}
function ln(){
  const dS=CF.cDist*CF.cDist;
  for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const dx=ps[i].x-ps[j].x,dy=ps[i].y-ps[j].y,d2=dx*dx+dy*dy;if(d2<dS){const a=(1-d2/dS)*0.4;x.beginPath();x.moveTo(ps[i].x,ps[i].y);x.lineTo(ps[j].x,ps[j].y);x.strokeStyle='rgba(44,110,73,'+a.toFixed(3)+')';x.lineWidth=0.5;x.stroke()}}
  if(m.x>0){const mR2=CF.mR*CF.mR;for(const p of ps){const dx=p.x-m.x,dy=p.y-m.y,d2=dx*dx+dy*dy;if(d2<mR2){const a=(1-d2/mR2)*0.7;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(m.x,m.y);x.strokeStyle='rgba(76,150,108,'+a.toFixed(3)+')';x.lineWidth=1;x.stroke()}}}
}
function an(){x.clearRect(0,0,W,H);for(const p of ps){p.up();p.dr()}ln();requestAnimationFrame(an)}
rs();ps=[];for(let i=0;i<CF.count;i++)ps.push(new P());
addEventListener('resize',()=>{rs();for(const p of ps)p.rr()});
addEventListener('mousemove',e=>{m.x=e.clientX;m.y=e.clientY});
addEventListener('mouseleave',()=>{m.x=-9999;m.y=-9999});
addEventListener('touchmove',e=>{const t=e.touches[0];if(t){m.x=t.clientX;m.y=t.clientY}},{passive:true});
addEventListener('touchend',()=>{m.x=-9999;m.y=-9999});
an();
</script>
