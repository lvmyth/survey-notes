<script>
// ══════════════════════════════════════════════════
//  1. 核心计算引擎
// ══════════════════════════════════════════════════

const D2R = a => a * Math.PI / 180;
const R2D = a => a * 180 / Math.PI;

function fmtSta(pk) {
  const km = Math.floor(pk / 1000);
  const m = pk % 1000;
  return `K${km}+${m.toFixed(3).padStart(7,'0')}`;
}

function parseSta(s) {
  s = (s||'').replace(/[Kk]/g,'').trim();
  const p = s.split('+');
  if (p.length===2) return parseFloat(p[0]||0)*1000 + parseFloat(p[1]||0);
  return parseFloat(s)||0;
}

/** 度分秒 → 十进制度 */
function parseDMS(text) {
  if (!text) return 0;
  text = text.trim().replace(/°/g,' ').replace(/'/g,' ').replace(/"/g,' ');
  const parts = text.split(/\s+/).filter(Boolean);
  if (parts.length >= 2) {
    let d = parseFloat(parts[0]);
    const sign = d < 0 ? -1 : 1;
    d = Math.abs(d);
    const m = parseFloat(parts[1]) || 0;
    const s = parseFloat(parts[2]) || 0;
    return sign * (d + m/60 + s/3600);
  }
  return parseFloat(text) || 0;
}

class JiaoDianCalc {
  constructor(jd, alphaDeg, R, Ls, rw) {
    this.jd = jd;
    this.alphaDeg = Math.abs(alphaDeg);
    this.turn = alphaDeg > 0 ? '右' : '左';
    this.R = R; this.Ls = Ls; this.roadWidth = rw;
    this.sign = alphaDeg > 0 ? 1 : -1;
    this.alpha = D2R(this.alphaDeg);
    this._calc();
  }

  _calc() {
    const R=this.R, Ls=this.Ls, a=this.alpha;
    this.beta0 = Ls/(2*R);
    this.beta0Deg = R2D(this.beta0);
    this.q = Ls/2 - Ls**3/(240*R**2);
    this.p = Ls**2/(24*R) - Ls**4/(2688*R**3);
    this.Th = (R+this.p)*Math.tan(a/2) + this.q;
    let Ly = R*(a-2*this.beta0);
    if (Ly < -1e-9) { alert(`圆曲线长度为负 (${Ly.toFixed(2)}m)！请增大R或减小Ls/α`); throw Error(); }
    this.Ly = Math.max(Ly, 0);
    this.Lh = this.Ly + 2*Ls;
    this.Eh = (R+this.p)/Math.cos(a/2) - R;
    this.Dh = 2*this.Th - this.Lh;
    this.ZH = this.jd - this.Th;
    this.HY = this.ZH + Ls;
    this.QZ = this.HY + this.Ly/2;
    this.YH = this.QZ + this.Ly/2;
    this.HZ = this.YH + Ls;
  }

  getFunc(ZHx, ZHy, azDeg) {
    const az0 = D2R(azDeg), s=this.sign, R=this.R, Ls=this.Ls, a=this.alpha, zh=this.ZH;
    const LsLy = Ls + this.Ly;
    const xHy = Ls - Ls**3/(40*R**2) + Ls**5/(3456*R**4);
    const yHy = s*(Ls**2/(6*R) - Ls**4/(336*R**3) + Ls**6/(42240*R**5));
    const phiYh = this.Ly / R;
    const xYh = xHy + R*Math.sin(phiYh);
    const yYh = yHy + s*R*(1-Math.cos(phiYh));
    const yhTang = s*(this.beta0 + phiYh);
    const xHz = xYh + (xHy*Math.cos(yhTang) - yHy*Math.sin(yhTang));
    const yHz = yYh + (xHy*Math.sin(yhTang) + yHy*Math.cos(yhTang));

    return function(mileage, offset=0) {
      const l = mileage - zh;
      let xl, yl, taz, ptype;
      if (l < 0) {
        xl=l; yl=0; taz=az0; ptype='直线段';
      } else if (Ls>0 && l<=Ls) {
        xl = l - l**5/(40*R**2*Ls**2) + l**9/(3456*R**4*Ls**4);
        yl = s*(l**3/(6*R*Ls) - l**7/(336*R**3*Ls**3) + l**11/(42240*R**5*Ls**5));
        taz = az0 + s*l**2/(2*R*Ls);
        ptype='缓和曲线';
      } else if (l<=LsLy) {
        const lc=l-Ls, phi=lc/R;
        xl = xHy + R*Math.sin(phi);
        yl = yHy + s*R*(1-Math.cos(phi));
        taz = az0 + s*(this.beta0+phi);
        ptype='圆曲线';
      } else if (l<=this.Lh) {
        const lc2=l-LsLy;
        const xc2 = lc2 - lc2**5/(40*R**2*Ls**2) + lc2**9/(3456*R**4*Ls**4);
        const yc2 = s*(lc2**3/(6*R*Ls) - lc2**7/(336*R**3*Ls**3) + lc2**11/(42240*R**5*Ls**5));
        xl = xYh + (xc2*Math.cos(yhTang) - yc2*Math.sin(yhTang));
        yl = yYh + (xc2*Math.sin(yhTang) + yc2*Math.cos(yhTang));
        taz = az0 + yhTang + s*lc2**2/(2*R*Ls);
        ptype='缓和曲线';
      } else {
        const sa=l-this.Lh;
        xl = xHz + sa*Math.cos(a);
        yl = yHz + s*sa*Math.sin(a);
        taz = az0 + s*a;
        ptype='直线段';
      }
      const x = ZHx + xl*Math.cos(az0) - yl*Math.sin(az0);
      const y = ZHy + xl*Math.sin(az0) + yl*Math.cos(az0);
      if (offset!==0) {
        const na = taz + Math.PI/2;
        return [x+offset*Math.cos(na), y+offset*Math.sin(na), ptype, R2D(taz)%360];
      }
      return [x, y, ptype, R2D(taz)%360];
    }.bind(this);
  }
}

// ══════════════════════════════════════════════════
//  2. 全局状态
// ══════════════════════════════════════════════════

let calc = null, calcFunc = null, stakeData = [], zoomLevel = 1, showStakes = true, _cachedVer = 0;
const COLORS = ['#E53935','#1565C0','#4CAF50','#FF9800','#9C27B0'];

// ══════════════════════════════════════════════════
//  3. 输入读取
// ══════════════════════════════════════════════════

function getVals() {
  const jd = (parseFloat($('jdKm')||0)*1000) + (parseFloat($('jdM')||0));
  return {
    jd, alpha: parseDMS($('alpha')), R: parseFloat($('radius')||0),
    Ls: parseFloat($('lsEntry')||0), rw: parseFloat($('roadW')||12),
    zhX: parseFloat($('zhX')||500000), zhY: parseFloat($('zhY')||3000000),
    az: parseDMS($('startAz')),
    pkFrom: $('pkFrom'), pkTo: $('pkTo'), interval: parseFloat($('interval')||20),
    offset: parseFloat($('offsetVal')||0),
  };
}

// ══════════════════════════════════════════════════
//  4. 计算要素
// ══════════════════════════════════════════════════

function doCalc() {
  const v = getVals();
  if (v.jd<=0) { alert('交点里程必须大于0'); return; }
  if (v.R<=0||v.Ls<=0) { alert('半径和缓和曲线长必须大于0'); return; }
  if (v.alpha===0) { alert('转角不能为0'); return; }
  try {
    calc = new JiaoDianCalc(v.jd, v.alpha, v.R, v.Ls, v.rw);
    calcFunc = calc.getFunc(v.zhX, v.zhY, v.az);
    document.getElementById('summaryBox').style.display='';
    const txt = [
      `交点里程 JD: ${fmtSta(calc.jd)}`,
      `转角 α: ${calc.alphaDeg.toFixed(4)}° (${calc.turn}转)`,
      `半径 R: ${calc.R.toFixed(2)} m`,
      `缓和曲线长 Ls: ${calc.Ls.toFixed(2)} m`,
      `路面宽度: ${calc.roadWidth.toFixed(2)} m`,
      ``,
      `缓和曲线角 β₀: ${calc.beta0Deg.toFixed(4)}°`,
      `切线增值 q: ${calc.q.toFixed(4)} m`,
      `内移值 p: ${calc.p.toFixed(4)} m`,
      `切线长 Th: ${calc.Th.toFixed(4)} m`,
      `圆曲线长 Ly: ${calc.Ly.toFixed(4)} m`,
      `曲线总长 Lh: ${calc.Lh.toFixed(4)} m`,
      `外矢距 Eh: ${calc.Eh.toFixed(4)} m`,
      `切曲差 Dh: ${calc.Dh.toFixed(4)} m`,
      ``,
      `ZH: ${fmtSta(calc.ZH)}`,
      `HY: ${fmtSta(calc.HY)}`,
      `QZ: ${fmtSta(calc.QZ)}`,
      `YH: ${fmtSta(calc.YH)}`,
      `HZ: ${fmtSta(calc.HZ)}`,
    ].join('\n');
    document.getElementById('summaryText').textContent = txt;
    document.getElementById('summaryText').style.textAlign = 'left';
    document.getElementById('summaryText').style.color = '#333';
    $('pkFrom', calc.ZH.toFixed(3));
    $('pkTo', calc.HZ.toFixed(3));
    _cachedVer++;
    redraw();
  } catch(e) { if (e.message) alert(e.message); }
}

function $(id, val) {
  const el = document.getElementById(id);
  if (!el) return '';
  if (val!==undefined) el.value = val;
  return el.value;
}

// ══════════════════════════════════════════════════
//  5. 逐桩坐标
// ══════════════════════════════════════════════════

function selectRow(tr) {
  const body = document.getElementById('stakeBody');
  const selected = body.querySelector('.selected');
  if (selected && selected !== tr) selected.classList.remove('selected');
  tr.classList.toggle('selected');
}

function doStakes() {
  if (!calc||!calcFunc) { alert('请先点击「计算要素」'); return; }
  const v = getVals();
  const from = parseSta(v.pkFrom)||calc.ZH;
  const to = parseSta(v.pkTo)||calc.HZ;
  const interval = v.interval||20;
  const offset = v.offset||0;

  const stSet = new Set();
  for (const mp of [calc.ZH, calc.HY, calc.QZ, calc.YH, calc.HZ]) {
    if (from<=mp && mp<=to) stSet.add(Math.round(mp*1000)/1000);
  }
  let start = Math.ceil(from/interval)*interval;
  let end = Math.floor(to/interval)*interval;
  for (let s=start; s<=end; s+=interval) stSet.add(s);
  const stList = [...stSet].sort((a,b)=>a-b);

  stakeData = [];
  for (const s of stList) {
    const [x,y,pt,az] = calcFunc(s, offset);
    stakeData.push([fmtSta(s), s, x, y, az, pt]);
  }

  const header = document.getElementById('stakeHeader');
  const body = document.getElementById('stakeBody');
  header.innerHTML = '<th>桩号</th><th>里程(m)</th><th>X</th><th>Y</th><th>方位角°</th><th>类型</th>';
  body.innerHTML = stakeData.map((r,i) =>
    `<tr onclick="selectRow(this)" data-idx="${i}"><td>${r[0]}</td><td>${r[1].toFixed(3)}</td><td>${r[2].toFixed(3)}</td><td>${r[3].toFixed(3)}</td><td>${r[4].toFixed(4)}</td><td>${r[5]}</td></tr>`
  ).join('');
  document.getElementById('stakeBox').style.display='';
  redraw();
}

function toggleStakes() {
  showStakes = !showStakes;
  document.getElementById('stakeContent').style.display = showStakes ? '' : 'none';
  document.getElementById('stakeToggle').textContent = showStakes ? '▼' : '▶';
}

// ══════════════════════════════════════════════════
//  6. Canvas 绘图
// ══════════════════════════════════════════════════

function resizeCanvas() {
  const canvas = document.getElementById('canvas');
  const w = canvas.clientWidth, h = 550;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas._w = w;
  canvas._h = h;
  return { canvas, ctx: canvas.getContext('2d'), dpr };
}

let _cachedPts = null;
let _cachedStakes = null;

function redraw() {
  if (!calc||!calcFunc) {
    const { canvas:cv, ctx:cx } = resizeCanvas();
    cx.clearRect(0,0,cv._w,cv._h);
    cx.fillStyle='#9E9E9E'; cx.font='14px Microsoft YaHei,sans-serif';
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText('请先点击「计算要素」', cv._w/2, cv._h/2);
    return;
  }

  const { ctx:cx, dpr } = resizeCanvas();
  const W=_cachedPts?._canvasW||document.getElementById('canvas')._w;
  const H=550;
  const canvas = document.getElementById('canvas');
  const w = canvas._w, h = canvas._h;
  cx.clearRect(0,0,w,h);

  // ---- 生成曲线点 ----
  if (!_cachedPts || _cachedVer !== _cachedPts._ver) {
    const num = 500;
    _cachedStakes = [];
    _cachedPts = [];
    _cachedPts._ver = _cachedVer;
    for (let i=0; i<=num; i++) {
      const s = calc.ZH + (calc.HZ-calc.ZH)*i/num;
      _cachedStakes.push(s);
      try {
        const [x,y] = calcFunc(s, 0);
        _cachedPts.push([x,y]);
      } catch(e) { _cachedPts.push([0,0]); }
    }
    _cachedPts._canvasW = w;
  }
  const pts = _cachedPts;

  // ---- 坐标范围 ----
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for (const p of pts) { if (p[0]<minX) minX=p[0]; if (p[0]>maxX) maxX=p[0]; if (p[1]<minY) minY=p[1]; if (p[1]>maxY) maxY=p[1]; }
  const span = Math.max(maxX-minX, maxY-minY, 5)*1.2;
  const cxPt = (minX+maxX)/2, cyPt = (minY+maxY)/2;
  const margin = 50;
  const scale = Math.min((w-margin*2)/span, (h-margin*2)/span, 40)*zoomLevel;
  const toX = x => (x-cxPt)*scale + w/2;
  const toY = y => (cyPt-y)*scale + h/2;

  // ---- 网格 ----
  cx.strokeStyle='#f0f0f0'; cx.lineWidth=0.5;
  for (let i=-20; i<=20; i++) {
    const gx = toX(cxPt+i*span/10);
    cx.beginPath(); cx.moveTo(gx,0); cx.lineTo(gx,h); cx.stroke();
    const gy = toY(cyPt+i*span/10);
    cx.beginPath(); cx.moveTo(0,gy); cx.lineTo(w,gy); cx.stroke();
  }

  // ---- 分段绘制 ----
  const segs = [
    [calc.ZH, calc.HY, 0],
    [calc.HY, calc.YH, 1],
    [calc.YH, calc.HZ, 2],
  ];
  for (const [sta,end,ci] of segs) {
    const segPts = [];
    for (let i=0; i<pts.length; i++) {
      if (_cachedStakes[i]>=sta && _cachedStakes[i]<=end) segPts.push(pts[i]);
    }
    if (!segPts.length) continue;
    cx.strokeStyle=COLORS[ci%COLORS.length]; cx.lineWidth=2.5;
    cx.beginPath();
    for (let i=0; i<segPts.length; i++) {
      const sx=toX(segPts[i][0]), sy=toY(segPts[i][1]);
      if (i===0) cx.moveTo(sx,sy); else cx.lineTo(sx,sy);
    }
    cx.stroke();
  }

  // ---- 主点标记 ----
  const mainPts = [
    [calc.ZH,'ZH','#9C27B0'],
    [calc.HY,'HY','#FF9800'],
    [calc.QZ,'QZ','#E53935'],
    [calc.YH,'YH','#FF9800'],
    [calc.HZ,'HZ','#9C27B0'],
  ];
  for (const [pk,label,color] of mainPts) {
    try {
      const [x,y] = calcFunc(pk, 0);
      const sx=toX(x), sy=toY(y);
      cx.beginPath(); cx.arc(sx,sy,4,0,2*Math.PI);
      cx.fillStyle=color; cx.fill();
      cx.strokeStyle='#fff'; cx.lineWidth=1.5; cx.stroke();
      cx.fillStyle=color; cx.font='bold 10px Consolas,monospace';
      cx.textAlign='left'; cx.textBaseline='bottom';
      cx.fillText(`${label} ${fmtSta(pk)}`, sx+8, sy-2);
    } catch(e) {}
  }

  // ---- 逐桩标注 ----
  if (stakeData.length) {
    const skip = Math.max(1, Math.floor(stakeData.length/30));
    for (let i=0; i<stakeData.length; i+=skip) {
      try {
        const r=stakeData[i];
        const sx=toX(r[2]), sy=toY(r[3]);
        cx.beginPath(); cx.arc(sx,sy,2,0,2*Math.PI);
        cx.fillStyle='#333'; cx.fill();
        cx.fillStyle='#333'; cx.font='9px Consolas,monospace';
        cx.textAlign='left'; cx.textBaseline='bottom';
        cx.fillText(r[0], sx+4, sy-6);
      } catch(e) {}
    }
  }

  // ---- 图例 ----
  const legItems = [
    ['缓和曲线 (ZH~HY)','#E53935'],
    ['圆曲线 (HY~YH)','#1565C0'],
    ['缓和曲线 (YH~HZ)','#2e7d32'],
    ['主点','#9C27B0'],
  ];
  const legW=150, legH=legItems.length*16+8;
  const lx=10, ly=8;
  cx.fillStyle='rgba(255,255,255,0.85)'; cx.strokeStyle='#ddd'; cx.lineWidth=1;
  cx.beginPath(); cx.roundRect(lx,ly,legW,legH,4); cx.fill(); cx.stroke();
  for (let i=0; i<legItems.length; i++) {
    const iy = ly+8 + i*16;
    cx.strokeStyle=legItems[i][1]; cx.lineWidth=2.5;
    cx.beginPath(); cx.moveTo(lx+8,iy); cx.lineTo(lx+28,iy); cx.stroke();
    cx.fillStyle='#333'; cx.font='10px Microsoft YaHei,sans-serif';
    cx.textAlign='left'; cx.textBaseline='middle';
    cx.fillText(legItems[i][0], lx+32, iy);
  }

  // ---- 水印 ----
  cx.fillStyle='#ccc'; cx.font='9px Microsoft YaHei,sans-serif';
  cx.textAlign='right'; cx.textBaseline='bottom';
  cx.fillText('By Lvmyth AI', w-6, h-4);
}

// ══════════════════════════════════════════════════
//  7. 缩放控制
// ══════════════════════════════════════════════════

function zoom(f) {
  zoomLevel = Math.max(0.1, Math.min(zoomLevel*f, 10));
  document.getElementById('zoomLabel').textContent = `${Math.round(zoomLevel*100)}%`;
  redraw();
}
function zoomReset() { zoomLevel=1; document.getElementById('zoomLabel').textContent='100%'; redraw(); }

document.getElementById('canvas').addEventListener('wheel', e => {
  e.preventDefault();
  zoom(e.deltaY < 0 ? 1.15 : 0.87);
}, { passive: false });

// ══════════════════════════════════════════════════
//  8. 导出CSV（线元格式）
// ══════════════════════════════════════════════════

function exportCsv() {
  if (!calc) { alert('请先点击「计算要素」'); return; }
  const rows = [];
  const R = Math.abs(calc.R), Ls = calc.Ls;
  const A = Ls>0 ? Math.sqrt(R*Ls) : 0;
  const turn = calc.turn==='右'?'R':'L';
  const func = calcFunc;

  const [zhX,zhY,_t1,zhAz] = func(calc.ZH,0);
  const [hyX,hyY,_t2,hyAz] = func(calc.HY,0);
  const [yhX,yhY,_t3,yhAz] = func(calc.YH,0);
  const [hzX,hzY,_t4,hzAz] = func(calc.HZ,0);

  if (Ls>0) {
    rows.push([fmtSta(calc.ZH), fmtSta(calc.HY), zhX.toFixed(3), zhY.toFixed(3), zhAz.toFixed(6),
      'SPIROIR', String(R), turn, String(Ls), A.toFixed(4)]);
  }
  rows.push([fmtSta(calc.HY), fmtSta(calc.YH), hyX.toFixed(3), hyY.toFixed(3), hyAz.toFixed(6),
    'CIRCLE', String(R), turn, '0', '0']);
  if (Ls>0) {
    rows.push([fmtSta(calc.YH), fmtSta(calc.HZ), yhX.toFixed(3), yhY.toFixed(3), yhAz.toFixed(6),
      'SPIROIR', String(R), turn, String(Ls), A.toFixed(4)]);
  }
  rows.push([fmtSta(calc.HZ), fmtSta(calc.HZ+100), hzX.toFixed(3), hzY.toFixed(3), hzAz.toFixed(6),
    'LINE', '0', turn, '0', '0']);

  let csv = '\uFEFF序号,起点桩号,终点桩号,起点X,起点Y,方位角°,类型,半径,转向,缓和长,回旋参数A\n';
  rows.forEach((r,i) => { csv += `${i+1},${r.join(',')}\n`; });
  download(csv, `交点法_R${R}_Ls${Ls}.csv`, 'text/csv');
}

// ══════════════════════════════════════════════════
//  9. 导出CAD脚本
// ══════════════════════════════════════════════════

function exportScr() {
  if (!calc) { alert('请先点击「计算要素」'); return; }
  const num = 500;
  const stakes = [];
  for (let i=0; i<=num; i++) stakes.push(calc.ZH + (calc.HZ-calc.ZH)*i/num);

  let scr = `; AutoCAD SCRIPT file\n`;
  scr += `; Road curve exported by JiaoDianCalculator\n`;
  scr += `; R=${calc.R.toFixed(1)}m Ls=${calc.Ls.toFixed(1)}m alpha=${calc.alphaDeg.toFixed(1)}deg\n`;

  // 1. 道路中心线 PLINE
  scr += `_PLINE\n`;
  for (const s of stakes) {
    const [x,y] = calcFunc(s, 0);
    scr += `${x.toFixed(3)},${y.toFixed(3)}\n`;
  }
  scr += `\n`;

  // 2. 主点标记（圆）
  for (const [name,pk] of [['ZH',calc.ZH],['HY',calc.HY],['QZ',calc.QZ],['YH',calc.YH],['HZ',calc.HZ]]) {
    const [x,y] = calcFunc(pk,0);
    scr += `_CIRCLE\n${x.toFixed(3)},${y.toFixed(3)}\n1\n`;
  }

  // 3. 主点标注
  for (const [name,pk] of [['ZH',calc.ZH],['HY',calc.HY],['QZ',calc.QZ],['YH',calc.YH],['HZ',calc.HZ]]) {
    const [x,y] = calcFunc(pk,6);
    scr += `_TEXT\n${x.toFixed(3)},${y.toFixed(3)}\n1.5\n0\n${name} ${fmtSta(pk)}\n`;
  }

  // 4. 曲线要素标注
  const [x0,y0] = calcFunc(calc.ZH, -20);
  scr += `_TEXT\n${x0.toFixed(3)},${y0.toFixed(3)}\n2\n0\n=== CURVE ELEMENTS ===\n`;
  const items = [
    `Alpha = ${calc.alphaDeg.toFixed(2)} deg`,
    `R = ${calc.R.toFixed(1)} m`,
    `Ls = ${calc.Ls.toFixed(1)} m`,
    `Ly = ${calc.Ly.toFixed(2)} m`,
    `Th = ${calc.Th.toFixed(2)} m`,
    `Lh = ${calc.Lh.toFixed(2)} m`,
    `Eh = ${calc.Eh.toFixed(2)} m`,
    `Dh = ${calc.Dh.toFixed(2)} m`,
  ];
  items.forEach((txt, i) => {
    const yPos = y0 - (i+1)*3;
    scr += `_TEXT\n${x0.toFixed(3)},${yPos.toFixed(3)}\n1.5\n0\n${txt}\n`;
  });

  // 5. 视图
  scr += `_ZOOM\nE\n`;

  download(scr, `jiaodian_R${Math.round(calc.R)}_Ls${Math.round(calc.Ls)}.scr`, 'application/octet-stream');
}

function download(content, filename, mime) {
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
