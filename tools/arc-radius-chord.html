<body>
<canvas id="particleCanvas"></canvas>
<script src="../navbar.js"></script>
<div class="container" style="max-width:1200px;margin:0 auto;padding:1rem;flex:1;width:100%;box-sizing:border-box;background:var(--bg)">
<div class="main-panel" style="padding:0;background:none;max-width:none;margin:0;flex:1">
  <div class="left">
    <div class="field">
      <label>弦长 D <span class="unit">（弧两端直线距离）</span></label>
      <div style="display:flex;align-items:center;gap:6px"><input id="D" type="number" value="10" step="any" style="flex:1"><span class="unit">m</span></div>
    </div>
    <div class="field">
      <label>拱高 B <span class="unit">（弧顶到弦的垂直高度）</span></label>
      <div style="display:flex;align-items:center;gap:6px"><input id="B" type="number" value="2" step="any" style="flex:1"><span class="unit">m</span></div>
    </div>
    <button class="btn" onclick="calc()">计 算</button>

    <div class="result-card">
      <div class="label">半径 R</div>
      <div class="value" style="color:var(--primary-dark)" id="rVal">--</div>
      <div class="unit-row">米</div>
    </div>
    <div class="result-card">
      <div class="label">圆心角 θ</div>
      <div class="value" style="color:#2196F3" id="thetaVal">--</div>
      <div class="unit-row">度</div>
    </div>
    <div class="result-card">
      <div class="label">弧长 L</div>
      <div class="value" style="color:#4CAF50" id="lVal">--</div>
      <div class="unit-row">米</div>
    </div>
    <div class="result-card">
      <div class="label">矢高比 B/D</div>
      <div class="value" style="color:#636e72" id="ratioVal">--</div>
    </div>

    <div class="history-box">
      <h3>📋 计算记录 <button onclick="clearHistory()">清空记录</button></h3>
      <div id="historyList"></div>
    </div>
  </div>

  <div class="right">
    <canvas id="c"></canvas>
  </div>
</div>
<div style="text-align:center;padding:1.5rem 0 2rem;border-top:1px solid var(--border);margin-top:2rem;color:var(--text-light);font-size:0.85rem">
  <a href="mailto:lvmyth@qq.com" style="color:var(--text-light);text-decoration:none">By Lvmyth AI</a>
</div>
</div>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
var lastVals = null;

// ─── 历史记录 ───
var historyKey='arc_radius_chord_history';
function getHist(){try{return JSON.parse(localStorage.getItem(historyKey))||[]}catch(e){return[]}}
function saveHist(arr){try{localStorage.setItem(historyKey,JSON.stringify(arr.slice(0,50)))}catch(e){}}
function addHist(R,thetaDeg,L){
  var arr=getHist();
  arr.unshift({R:R,theta:thetaDeg,L:L,time:new Date().toLocaleString()});
  saveHist(arr);renderHist();
}
function renderHist(){
  var arr=getHist(),el=document.getElementById('historyList');
  if(!el)return;
  if(arr.length===0){el.innerHTML='<div style="color:var(--text-light);font-size:12px;padding:8px;text-align:center">暂无记录</div>';return}
  el.innerHTML=arr.map(function(r,i){
    return'<div class="hist-item"><span class="tag">R='+r.R.toFixed(2)+'</span><span class="coord">θ='+r.theta.toFixed(2)+'° L='+r.L.toFixed(2)+'m</span><span style="color:var(--text-light);font-size:10px;margin-left:auto;flex-shrink:0">'+r.time+'</span><span class="del" onclick="delHist('+i+')">✕</span></div>'
  }).join('');
}
function delHist(i){var arr=getHist();arr.splice(i,1);saveHist(arr);renderHist()}
function clearHistory(){saveHist([]);renderHist()}

function calc() {
  const D = parseFloat(document.getElementById('D').value) || 0;
  const B = parseFloat(document.getElementById('B').value) || 0;
  if (D <= 0 || B <= 0) return;

  const R = (D*D + 4*B*B) / (8*B);
  const thetaRad = 2 * Math.asin(Math.min(D/(2*R),1));
  const thetaDeg = thetaRad * 180 / Math.PI;
  const L = R * thetaRad;
  const ratio = B / D;

  document.getElementById('rVal').textContent = R.toFixed(4);
  document.getElementById('thetaVal').textContent = thetaDeg.toFixed(2);
  document.getElementById('lVal').textContent = L.toFixed(4);
  document.getElementById('ratioVal').textContent = ratio.toFixed(4);

  draw(D, B, R);
  addHist(R,thetaDeg,L);
  lastVals = {D,B,R};
}

function draw(D, B, R) {
  const dpr = window.devicePixelRatio || 1;
  const rect = c.parentElement.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  c.width = w * dpr; c.height = h * dpr;
  c.style.width = w + 'px'; c.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const half = D/2, m = 50;
  const yMin = Math.min(0, B-R)*1.05 - 1;
  const yMax = Math.max(B, 0)*1.3 + 1;
  const xRange = Math.max(half, Math.abs(B-R))*1.35;
  const s = Math.min((w-2*m)/(2*xRange), (h-2*m)/(yMax-yMin));
  const tx = x => w/2 + x*s;
  const ty = y => h - m - (y - yMin)*s;

  // grid
  ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 1;
  ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(m, h/2); ctx.lineTo(w-m, h/2); ctx.stroke();
  ctx.setLineDash([]);

  // arc
  const ha = Math.asin(half/R);
  ctx.strokeStyle = '#D4A017'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i <= 80; i++) {
    const a = -ha + 2*ha*i/80;
    const px = R*Math.sin(a), py = (B-R) + R*Math.cos(a);
    i === 0 ? ctx.moveTo(tx(px),ty(py)) : ctx.lineTo(tx(px),ty(py));
  }
  ctx.stroke();

  // chord
  ctx.strokeStyle = '#37474F'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(tx(-half),ty(0)); ctx.lineTo(tx(half),ty(0)); ctx.stroke();
  for (const px of [-half, half]) {
    ctx.beginPath(); ctx.arc(tx(px),ty(0),5,0,Math.PI*2); ctx.fillStyle='#D4A017'; ctx.fill();
  }

  // sagitta
  ctx.strokeStyle = '#FF9800'; ctx.lineWidth = 2;
  ctx.setLineDash([5,3]);
  ctx.beginPath(); ctx.moveTo(tx(0),ty(0)); ctx.lineTo(tx(0),ty(B)); ctx.stroke();
  ctx.setLineDash([]);
  for (const py of [0,B]) {
    ctx.beginPath(); ctx.moveTo(tx(0)-5,ty(py)); ctx.lineTo(tx(0)+5,ty(py)); ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(tx(0),ty(B),5,0,Math.PI*2); ctx.fillStyle='#FF9800'; ctx.fill();

  // center O
  const ox=tx(0), oy=ty(B-R);
  ctx.beginPath(); ctx.arc(ox,oy,5,0,Math.PI*2); ctx.fillStyle='#2196F3'; ctx.fill();
  ctx.font = 'bold 12px Consolas'; ctx.fillStyle = '#2196F3';
  ctx.fillText('O', ox+10, oy+14);

  // radius line
  ctx.strokeStyle = '#2196F3'; ctx.lineWidth = 1.5;
  ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(tx(half),ty(0)); ctx.stroke();
  ctx.setLineDash([]);

  // labels
  ctx.font = '12px Microsoft YaHei';
  ctx.fillStyle = '#37474F'; ctx.textAlign = 'center';
  ctx.fillText('D = '+D.toFixed(2)+' m', tx(0), ty(0)+22);
  ctx.fillStyle = '#2196F3';
  ctx.fillText('R = '+R.toFixed(2)+' m', (ox+tx(half))/2, (oy+ty(0))/2 - 10);

  // B label (vertical)
  ctx.save(); ctx.translate(tx(0)+22, (ty(0)+ty(B))/2);
  ctx.rotate(Math.PI/2); ctx.fillStyle = '#FF9800'; ctx.textAlign = 'center';
  ctx.fillText('B = '+B.toFixed(2)+' m', 0, 0); ctx.restore();

  // endpoints
  ctx.fillStyle = '#D4A017'; ctx.textAlign = 'right';
  ctx.fillText('A', tx(-half)-8, ty(0)+4);
  ctx.textAlign = 'left';
  ctx.fillText('C', tx(half)+8, ty(0)+4);

  // By Lvmyth AI
  ctx.fillStyle = 'rgba(150,150,150,0.6)';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  ctx.fillText('By Lvmyth AI', w - 10, h - 10);
}

window.addEventListener('load', function(){calc();renderHist();});
window.addEventListener('resize', ()=>{if(document.getElementById('rVal').textContent!=='--')calc()});

// ─── 画布重绘 ───
</script>
<script src="../particles.js"></script>
</body>
