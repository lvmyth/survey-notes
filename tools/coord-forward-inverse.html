<script>
// ─── State ───
let forwardData = null;
let inverseData = null;
let currentTab = 'forward';

// ─── 角度解析 (支持度分秒空格格式) ───
function parseAngle(str){
  str=str.trim();
  if(!str)return NaN;
  if(/^-?\d+(\.\d+)?$/.test(str))return parseFloat(str);
  var p=str.replace(/[°′″'"]/g,' ').trim().split(/\s+/).map(Number);
  if(p.length>=3)return p[0]+p[1]/60+p[2]/3600;
  if(p.length===2)return p[0]+p[1]/60;
  return parseFloat(str);
}

// ─── 历史记录 ───
var historyKey='coord_history';
function getHist(){try{return JSON.parse(localStorage.getItem(historyKey))||[]}catch(e){return[]}}
function saveHist(arr){try{localStorage.setItem(historyKey,JSON.stringify(arr.slice(0,50)))}catch(e){}}
function addHist(type,info){
  var arr=getHist();
  arr.unshift({type:type,info:info,time:new Date().toLocaleString()});
  saveHist(arr);renderHist();
}
function renderHist(){
  var arr=getHist(),el=document.getElementById('historyList');
  if(!el)return;
  if(arr.length===0){el.innerHTML='<div style="color:var(--text-light);font-size:12px;padding:8px;text-align:center">暂无记录</div>';return}
  el.innerHTML=arr.map(function(r,i){
    return'<div class="hist-item"><span class="tag">'+r.type+'</span><span>'+r.info+'</span><span style="color:var(--text-light);font-size:10px;margin-left:auto">'+r.time+'</span><span class="del" onclick="delHist('+i+')">✕</span></div>'
  }).join('');
}
function delHist(i){var arr=getHist();arr.splice(i,1);saveHist(arr);renderHist()}
function clearHistory(){saveHist([]);renderHist()}

// ─── Tab switching ───
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + tab));
  redraw();
}

// ─── DMS formatting ───
function toDMS(deg) {
  const d = Math.floor(deg);
  const mf = (deg - d) * 60;
  const m = Math.floor(mf);
  const s = (mf - m) * 60;
  return d + '°' + m + '′' + s.toFixed(1) + '″';
}

// ─── Forward calculation ───
function calcForward() {
  const sx = parseFloat(document.getElementById('fw-sx').value);
  const sy = parseFloat(document.getElementById('fw-sy').value);
  const d  = parseFloat(document.getElementById('fw-d').value);
  const a  = parseAngle(document.getElementById('fw-a').value);
  if (isNaN(sx) || isNaN(sy) || isNaN(d) || isNaN(a)) {
    document.getElementById('fw-result').innerHTML = '<span class="red">请输入有效数字</span>';
    return;
  }
  const aRad = a * Math.PI / 180;
  const ex = sx + d * Math.cos(aRad);
  const ey = sy + d * Math.sin(aRad);
  const dx = ex - sx;
  const dy = ey - sy;

  forwardData = { sx, sy, ex, ey, d, a };
  inverseData = null;

  document.getElementById('fw-result').innerHTML =
    '<table>' +
    '<tr><td>ΔX</td><td class="green">' + dx.toFixed(4) + '</td></tr>' +
    '<tr><td>ΔY</td><td class="green">' + dy.toFixed(4) + '</td></tr>' +
    '<tr><td>终点 X</td><td class="blue">' + ex.toFixed(4) + '</td></tr>' +
    '<tr><td>终点 Y</td><td class="blue">' + ey.toFixed(4) + '</td></tr>' +
    '</table>' +
    '<div class="dms">方位角：' + a.toFixed(4) + '° = ' + toDMS(a) + '</div>';
  addHist('正算','S('+sx.toFixed(2)+','+sy.toFixed(2)+') D='+d.toFixed(2)+' α='+a.toFixed(4)+'°');
  redraw();
}

// ─── Inverse calculation ───
function calcInverse() {
  const x1 = parseFloat(document.getElementById('iv-x1').value);
  const y1 = parseFloat(document.getElementById('iv-y1').value);
  const x2 = parseFloat(document.getElementById('iv-x2').value);
  const y2 = parseFloat(document.getElementById('iv-y2').value);
  if (isNaN(x1) || isNaN(y1) || isNaN(x2) || isNaN(y2)) {
    document.getElementById('iv-result').innerHTML = '<span class="red">请输入有效数字</span>';
    return;
  }
  const dx = x2 - x1;
  const dy = y2 - y1;
  const d = Math.hypot(dx, dy);
  if (d < 1e-10) {
    document.getElementById('iv-result').innerHTML = '<span class="red">两点重合</span>';
    return;
  }
  let aRad = Math.atan2(dy, dx);
  if (aRad < 0) aRad += 2 * Math.PI;
  const a = aRad * 180 / Math.PI;

  inverseData = { x1, y1, x2, y2, d, a };
  forwardData = null;

  document.getElementById('iv-result').innerHTML =
    '<table>' +
    '<tr><td>ΔX</td><td class="green">' + dx.toFixed(4) + '</td></tr>' +
    '<tr><td>ΔY</td><td class="green">' + dy.toFixed(4) + '</td></tr>' +
    '<tr><td>平距 D</td><td class="blue">' + d.toFixed(4) + ' m</td></tr>' +
    '</table>' +
    '<div class="dms">方位角：' + a.toFixed(4) + '° = ' + toDMS(a) + '</div>';
  addHist('反算','P₁('+x1.toFixed(2)+','+y1.toFixed(2)+')→P₂('+x2.toFixed(2)+','+y2.toFixed(2)+') D='+d.toFixed(2)+' α='+a.toFixed(4)+'°');
  redraw();
}

// ─── Examples ───
function fwExample() {
  document.getElementById('fw-sx').value = '100.000';
  document.getElementById('fw-sy').value = '200.000';
  document.getElementById('fw-d').value  = '150.000';
  document.getElementById('fw-a').value  = '60.5';
  calcForward();
}
function ivExample() {
  document.getElementById('iv-x1').value = '100.000';
  document.getElementById('iv-y1').value = '200.000';
  document.getElementById('iv-x2').value = '150.000';
  document.getElementById('iv-y2').value = '250.000';
  calcInverse();
}

// ─── Canvas ───
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const wrap = canvas.parentElement;
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width  = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  redraw();
}

let drawWidth = 0, drawHeight = 0;
let zoom = 1;

function redraw() {
  const wrap = canvas.parentElement;
  const rect = wrap.getBoundingClientRect();
  drawWidth  = rect.width;
  drawHeight = rect.height;
  ctx.clearRect(0, 0, drawWidth, drawHeight);
  if (drawWidth < 60 || drawHeight < 60) return;

  // Get data
  let x1, y1, x2, y2, d, a, isForward;
  if (inverseData) {
    x1 = inverseData.x1; y1 = inverseData.y1;
    x2 = inverseData.x2; y2 = inverseData.y2;
    d = inverseData.d; a = inverseData.a;
    isForward = false;
  } else if (forwardData) {
    x1 = forwardData.sx; y1 = forwardData.sy;
    x2 = forwardData.ex; y2 = forwardData.ey;
    d = forwardData.d; a = forwardData.a;
    isForward = true;
  } else {
    x1 = 0; y1 = 0; x2 = 100; y2 = 100; d = 141.42; a = 45; isForward = false;
  }

  const margin = 45;
  const w = drawWidth, h = drawHeight;
  const xs = [x1, x2], ys = [y1, y2];
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  let span = Math.max(maxX - minX, maxY - minY, 5) * 1.5;
  if (span < 1) span = 10;
  const cxW = (minX + maxX) / 2, cyW = (minY + maxY) / 2;
  const scale = Math.min((w - margin * 2) / span, (h - margin * 2) / span, 40) * zoom;

  function tx(vx, vy) { return (vx - cxW) * scale + w / 2; }
  function ty(vx, vy) { return -(vy - cyW) * scale + h / 2; }

  // ── Zoom controls (右上角) ──
  var zx=w-150,zy=margin+4,zw=142,zh=30;
  ctx.fillStyle='rgba(255,255,255,0.9)';ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=1;ctx.roundRect(zx,zy,zw,zh,5);ctx.fill();ctx.stroke();
  ctx.fillStyle='#555';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';var btnY=zy+15;
  ctx.fillText('+',zx+16,btnY);ctx.fillText('−',zx+108,btnY);ctx.fillText('↺',zx+130,btnY);
  ctx.font='10px sans-serif';ctx.fillStyle='#444';ctx.textAlign='center';ctx.fillText((zoom*100).toFixed(0)+'%',zx+64,btnY);

  // ── Grid ──
  const grid = Math.max(1, Math.pow(10, Math.floor(Math.log10(span / 3))));
  ctx.strokeStyle = '#f0f0f0';
  ctx.lineWidth = 1;
  for (let gx = Math.floor((cxW - span / 2) / grid) * grid; gx < cxW + span / 2; gx += grid) {
    const px = tx(gx, 0);
    if (px >= 0 && px <= w) { ctx.beginPath(); ctx.moveTo(px, margin); ctx.lineTo(px, h - margin); ctx.stroke(); }
  }
  for (let gy = Math.floor((cyW - span / 2) / grid) * grid; gy < cyW + span / 2; gy += grid) {
    const py = ty(0, gy);
    if (py >= margin && py <= h - margin) { ctx.beginPath(); ctx.moveTo(margin, py); ctx.lineTo(w - margin, py); ctx.stroke(); }
  }

  // Coordinate transforms for pixel coords
  const p1x = tx(x1, y1), p1y = ty(x1, y1);
  const p2x = tx(x2, y2), p2y = ty(x2, y2);

  // ── Main line ──
  ctx.strokeStyle = '#E53935';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y); ctx.stroke();

  // Distance label
  const midX = (p1x + p2x) / 2, midY = (p1y + p2y) / 2;
  ctx.font = 'bold 11px Consolas,sans-serif';
  ctx.fillStyle = '#E53935';
  ctx.textAlign = 'center';
  ctx.fillText('D = ' + d.toFixed(2) + ' m', midX, midY - 14);

  // ── Start point (blue) ──
  ctx.beginPath(); ctx.arc(p1x, p1y, 6, 0, 2 * Math.PI);
  ctx.fillStyle = '#1565C0'; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = 'bold 10px Consolas,sans-serif';
  ctx.fillStyle = '#1565C0';
  ctx.textAlign = 'right';
  ctx.fillText('P₁(' + x1.toFixed(2) + ', ' + y1.toFixed(2) + ')', p1x - 10, p1y - 10);

  // ── End point (red) ──
  ctx.beginPath(); ctx.arc(p2x, p2y, 6, 0, 2 * Math.PI);
  ctx.fillStyle = '#E53935'; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = 'bold 10px Consolas,sans-serif';
  ctx.fillStyle = '#E53935';
  ctx.textAlign = 'left';
  ctx.fillText('P₂(' + x2.toFixed(2) + ', ' + y2.toFixed(2) + ')', p2x + 10, p2y + 14);

  // ── ΔX horizontal dashed green ──
  const dxVal = x2 - x1;
  const dyVal = y2 - y1;
  const cyPix = ty(0, cyW);
  if (Math.abs(dxVal) > 0.01) {
    ctx.strokeStyle = '#4CAF50';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(p1x, cyPix);
    ctx.lineTo(p1x + (p2x - p1x) * 0.5, cyPix);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '10px Consolas,sans-serif';
    ctx.fillStyle = '#4CAF50';
    ctx.textAlign = 'center';
    ctx.fillText('ΔX=' + dxVal.toFixed(2), p1x + (p2x - p1x) * 0.5, cyPix - 10);
  }

  // ── ΔY vertical dashed orange ──
  if (Math.abs(dyVal) > 0.01) {
    ctx.strokeStyle = '#FF9800';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(p2x, ty(y2, cyW));
    ctx.lineTo(p2x, ty(y1, cyW));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '10px Consolas,sans-serif';
    ctx.fillStyle = '#FF9800';
    ctx.textAlign = 'left';
    ctx.fillText('ΔY=' + dyVal.toFixed(2), p2x + 8, (ty(y2, cyW) + ty(y1, cyW)) / 2 + 3);
  }

  // ── Azimuth arc from north ──
  if (d > 1) {
    const arcR = 30;
    let endAngle = Math.atan2(dyVal, dxVal);
    if (endAngle < 0) endAngle += 2 * Math.PI;
    // Canvas arc goes clockwise, y is inverted
    ctx.strokeStyle = '#FF9800';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    // start from north (up = -π/2 in canvas coords since y is flipped)
    // north in our coords is up = -π/2, we go clockwise to endAngle
    ctx.arc(p1x, p1y, arcR, -Math.PI / 2, -Math.PI / 2 + endAngle);
    ctx.stroke();

    // Label at midpoint of arc
    const labelAngle = endAngle / 2;
    const laX = p1x + (arcR + 16) * Math.cos(-Math.PI / 2 + labelAngle);
    const laY = p1y + (arcR + 16) * Math.sin(-Math.PI / 2 + labelAngle);
    ctx.font = 'bold 10px Consolas,sans-serif';
    ctx.fillStyle = '#FF9800';
    ctx.textAlign = 'center';
    ctx.fillText('α=' + a.toFixed(2) + '°', laX, laY);

    // North indicator
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(p1x, p1y); ctx.lineTo(p1x, p1y - arcR - 10); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#999';
    ctx.font = '10px sans-serif';
    ctx.fillText('N', p1x, p1y - arcR - 14);
  }

  // ── Legend (top-left) ──
  const legX = margin + 8, legY = margin + 8, legH = 20;
  ctx.font = 'bold 12px "Segoe UI","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  // Start point
  ctx.beginPath(); ctx.arc(legX + 6, legY + legH*0.5, 5, 0, 2 * Math.PI);
  ctx.fillStyle = '#1565C0'; ctx.fill();
  ctx.fillStyle = '#1565C0';
  ctx.fillText('起点 P1', legX + 16, legY + legH*0.5);

  // End point
  ctx.beginPath(); ctx.arc(legX + 6, legY + legH*1.5, 5, 0, 2 * Math.PI);
  ctx.fillStyle = '#E53935'; ctx.fill();
  ctx.fillStyle = '#E53935';
  ctx.fillText('终点 P2', legX + 16, legY + legH*1.5);

  // Line
  ctx.strokeStyle = '#E53935'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(legX, legY + legH*2.5); ctx.lineTo(legX + 24, legY + legH*2.5); ctx.stroke();
  ctx.fillStyle = '#E53935';
  ctx.fillText('测线 D', legX + 32, legY + legH*2.5);

  // Author
  ctx.fillStyle = 'rgba(150,150,150,0.6)';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('By Lvmyth AI', w - 10, h - 10);
}

window.onresize = resizeCanvas;
window.addEventListener('load', function() {
  resizeCanvas();
  renderHist();
  // Trigger initial calculation to show default data
  calcForward();
});

// ─── 画布缩放 (滚轮 + 点击 +/- 按钮) ───
(function(){
  var cvs=document.getElementById('canvas');
  cvs.addEventListener('wheel',function(e){
    e.preventDefault();
    var old=zoom;
    zoom*=e.deltaY<0?1.15:0.87;
    if(zoom<0.1)zoom=0.1;
    if(zoom>20)zoom=20;
    redraw();
  },{passive:false});
  cvs.addEventListener('click',function(e){
    var rect=cvs.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
    var w=parseFloat(cvs.style.width)||rect.width;
    var zx=w-150,zy=49,zw=142,zh=30;
    if(x>zx&&x<zx+zw&&y>zy&&y<zy+zh){
      var bx=x-zx;
      if(bx<32){zoom*=1.3;if(zoom>20)zoom=20;redraw()}
      else if(bx>98&&bx<122){zoom/=1.3;if(zoom<0.1)zoom=0.1;redraw()}
      else if(bx>122){zoom=1;redraw()}
    }
  });
})();
</script>
