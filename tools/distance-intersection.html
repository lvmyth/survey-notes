<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let zoom = 1;
let points = null;

// ─── 历史记录 ───
var historyKey='distance_intersection_history';
function getHist(){try{return JSON.parse(localStorage.getItem(historyKey))||[]}catch(e){return[]}}
function saveHist(arr){try{localStorage.setItem(historyKey,JSON.stringify(arr.slice(0,50)))}catch(e){}}
function addHist(xp,yp,label){
  var arr=getHist();
  arr.unshift({xp:xp,yp:yp,label:label,time:new Date().toLocaleString()});
  saveHist(arr);renderHist();
}
function renderHist(){
  var arr=getHist(),el=document.getElementById('historyList');
  if(!el)return;
  if(arr.length===0){el.innerHTML='<div style="color:var(--text-light);font-size:12px;padding:8px;text-align:center">暂无记录</div>';return}
  el.innerHTML=arr.map(function(r,i){
    return'<div class="hist-item"><span class="tag">'+r.label+'</span><span class="coord">X='+r.xp.toFixed(4)+' Y='+r.yp.toFixed(4)+'</span><span style="color:var(--text-light);font-size:10px;margin-left:auto;flex-shrink:0">'+r.time+'</span><span class="del" onclick="delHist('+i+')">✕</span></div>'
  }).join('');
}
function delHist(i){var arr=getHist();arr.splice(i,1);saveHist(arr);renderHist()}
function clearHistory(){saveHist([]);renderHist()}

function resizeCanvas() {
  const wrap = canvas.parentElement;
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function showResult(text) {
  document.getElementById('result').textContent = text;
}

function calculate() {
  try {
    const xa = parseFloat(document.getElementById('xa').value);
    const ya = parseFloat(document.getElementById('ya').value);
    const xb = parseFloat(document.getElementById('xb').value);
    const yb = parseFloat(document.getElementById('yb').value);
    const d_ap = parseFloat(document.getElementById('dap').value);
    const d_bp = parseFloat(document.getElementById('dbp').value);

    if (isNaN(xa)||isNaN(ya)||isNaN(xb)||isNaN(yb)||isNaN(d_ap)||isNaN(d_bp)) {
      showResult('输入错误：请检查所有数值是否有效');
      return;
    }
    if (d_ap <= 0 || d_bp <= 0) {
      showResult('参数错误：距离必须大于 0');
      return;
    }

    const d_ab = Math.hypot(xb - xa, yb - ya);
    if (d_ab <= 0) {
      showResult('参数错误：A、B 两点重合');
      return;
    }

    // 余弦定理求角A
    const cos_a = (d_ab*d_ab + d_ap*d_ap - d_bp*d_bp) / (2 * d_ab * d_ap);
    if (cos_a < -1 || cos_a > 1) {
      showResult('数据矛盾：三边不构成三角形（cosA=' + cos_a.toFixed(3) + '）');
      return;
    }

    const angle_a = Math.acos(Math.max(-1, Math.min(1, cos_a)));
    const az_ab = Math.atan2(xb - xa, yb - ya); // 测量坐标系

    // 两个解
    const xp1 = xa + d_ap * Math.sin(az_ab + angle_a);
    const yp1 = ya + d_ap * Math.cos(az_ab + angle_a);
    const xp2 = xa + d_ap * Math.sin(az_ab - angle_a);
    const yp2 = ya + d_ap * Math.cos(az_ab - angle_a);

    // 检核
    const d1 = Math.hypot(xp1 - xb, yp1 - yb);
    const d2 = Math.hypot(xp2 - xb, yp2 - yb);

    points = { xa, ya, xb, yb, d_ap, d_bp, d_ab, xp1, yp1, d1, xp2, yp2, d2,
               az_ab: az_ab * 180 / Math.PI, angle_a: angle_a * 180 / Math.PI,
               az_ab_rad: az_ab, angle_a_rad: angle_a };

    const res = 'AB 距离 = ' + d_ab.toFixed(4) + ' m\n'
      + '&ang;A = ' + (angle_a * 180 / Math.PI).toFixed(4) + '\u00b0\n'
      + '\u2501 解一（AB左侧）\n'
      + 'Xp\u2081 = ' + xp1.toFixed(4) + '\nYp\u2081 = ' + yp1.toFixed(4) + '\n'
      + '检核 BP = ' + d1.toFixed(3) + ' m（输入 ' + d_bp.toFixed(3) + '）\n\n'
      + '\u2501 解二（AB右侧）\n'
      + 'Xp\u2082 = ' + xp2.toFixed(4) + '\nYp\u2082 = ' + yp2.toFixed(4) + '\n'
      + '检核 BP = ' + d2.toFixed(3) + ' m（输入 ' + d_bp.toFixed(3) + '）';

    showResult(res);
    addHist(xp1,yp1,'解一');
    addHist(xp2,yp2,'解二');
    draw();
  } catch(e) {
    showResult('计算异常：' + e.message);
  }
}

function draw() {
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if (w < 60 || h < 60 || !points) return;

  const p = points;
  const margin = 50;
  const xs = [p.xa, p.xb, p.xp1, p.xp2];
  const ys = [p.ya, p.yb, p.yp1, p.yp2];
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const span = Math.max(maxX - minX, maxY - minY, 10) * 1.4;
  const cx_w = (minX + maxX) / 2, cy_w = (minY + maxY) / 2;
  const scale = Math.min((w - margin * 2) / span, (h - margin * 2) / span, 35) * zoom;

  function tx(vx) { return (vx - cx_w) * scale + w / 2; }
  function ty(vy) { return -(vy - cy_w) * scale + h / 2; }

  // 网格
  const grid = Math.max(Math.pow(10, Math.floor(Math.log10(span / 4))), 0.5);
  let gx = Math.floor((cx_w - span / 2) / grid) * grid;
  while (gx < cx_w + span / 2) {
    const px = tx(gx);
    if (px >= 0 && px <= w) {
      ctx.beginPath(); ctx.moveTo(px, margin); ctx.lineTo(px, h - margin);
      ctx.strokeStyle = '#f0f0f0'; ctx.lineWidth = 1; ctx.stroke();
    }
    gx += grid;
  }
  let gy = Math.floor((cy_w - span / 2) / grid) * grid;
  while (gy < cy_w + span / 2) {
    const py = ty(gy);
    if (py >= margin && py <= h - margin) {
      ctx.beginPath(); ctx.moveTo(margin, py); ctx.lineTo(w - margin, py);
      ctx.strokeStyle = '#f0f0f0'; ctx.lineWidth = 1; ctx.stroke();
    }
    gy += grid;
  }

  // AB基线
  const ax = tx(p.xa), ay = ty(p.ya);
  const bx = tx(p.xb), by = ty(p.yb);
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
  ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();

  // AB距离标注
  const midABx = (ax + bx) / 2, midABy = (ay + by) / 2;
  ctx.font = 'bold 11px Arial'; ctx.fillStyle = '#333';
  ctx.textAlign = 'center';
  ctx.fillText('AB=' + p.d_ab.toFixed(2) + 'm', midABx, midABy - 12);

  // 已知点A
  ctx.beginPath(); ctx.arc(ax, ay, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#2c6e49'; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = 'bold 11px Arial'; ctx.fillStyle = '#2c6e49';
  ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText('A(' + p.xa.toFixed(1) + ',' + p.ya.toFixed(1) + ')', ax - 8, ay - 8);

  // 已知点B
  ctx.beginPath(); ctx.arc(bx, by, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#2c6e49'; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = 'bold 11px Arial'; ctx.fillStyle = '#2c6e49';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('B(' + p.xb.toFixed(1) + ',' + p.yb.toFixed(1) + ')', bx + 8, by + 8);

  // 解一（左侧）- 红色
  const p1x = tx(p.xp1), p1y = ty(p.yp1);
  ctx.setLineDash([6, 3]);
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(p1x, p1y);
  ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(p1x, p1y);
  ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2; ctx.stroke();
  ctx.setLineDash([]);

  ctx.beginPath(); ctx.arc(p1x, p1y, 7, 0, Math.PI * 2);
  ctx.fillStyle = '#e74c3c'; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = 'bold 11px Arial'; ctx.fillStyle = '#e74c3c';
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillText('P\u2081(' + p.xp1.toFixed(2) + ',' + p.yp1.toFixed(2) + ')', p1x + 10, p1y - 10);

  // AP距离标注
  const mid1x = (ax + p1x) / 2, mid1y = (ay + p1y) / 2;
  ctx.font = '10px Arial'; ctx.fillStyle = '#e74c3c';
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillText('Dap=' + p.d_ap.toFixed(2), mid1x + 8, mid1y - 6);
  const mid2x = (bx + p1x) / 2, mid2y = (by + p1y) / 2;
  ctx.fillText('Dbp=' + p.d_bp.toFixed(2), mid2x - 8, mid2y + 6);

  // 解二（右侧）- 橙色
  const p2x = tx(p.xp2), p2y = ty(p.yp2);
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(p2x, p2y);
  ctx.strokeStyle = '#f39c12'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(p2x, p2y);
  ctx.strokeStyle = '#f39c12'; ctx.lineWidth = 2; ctx.stroke();
  ctx.setLineDash([]);

  ctx.beginPath(); ctx.arc(p2x, p2y, 7, 0, Math.PI * 2);
  ctx.fillStyle = '#f39c12'; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = 'bold 11px Arial'; ctx.fillStyle = '#f39c12';
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillText('P\u2082(' + p.xp2.toFixed(2) + ',' + p.yp2.toFixed(2) + ')', p2x - 10, p2y + 10);

  // 角度弧
  const arcR = 25;
  const azRad = p.az_ab_rad;
  const end1 = Math.atan2(p.xp1 - p.xa, p.yp1 - p.ya);
  const end2 = Math.atan2(p.xp2 - p.xa, p.yp2 - p.ya);
  [{end: end1, color: '#e74c3c'}, {end: end2, color: '#f39c12'}].forEach(function(item) {
    const startA = -azRad * 180 / Math.PI;
    const ext = (item.end - azRad) * 180 / Math.PI;
    ctx.beginPath();
    ctx.arc(ax, ay, arcR, -azRad, -item.end);
    ctx.strokeStyle = item.color; ctx.lineWidth = 1.5; ctx.stroke();
  });

  // ∠A标注
  const midAngle = (azRad + end1) / 2;
  const laX = ax + (arcR + 14) * Math.cos(midAngle);
  const laY = ay - (arcR + 14) * Math.sin(midAngle);
  ctx.font = 'bold 10px Arial'; ctx.fillStyle = '#e65100';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('\u2220A=' + p.angle_a.toFixed(1) + '\u00b0', laX, laY);

  // 图例
  const legendX = margin + 8, legendY = margin + 8;
  const ls = 14;

  ctx.beginPath(); ctx.arc(legendX + 4, legendY + 4, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#2c6e49'; ctx.fill();
  ctx.font = '10px Arial'; ctx.fillStyle = '#2c6e49';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('已知点', legendX + 12, legendY + 4);

  ctx.beginPath(); ctx.arc(legendX + 4, legendY + 4 + ls, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#e74c3c'; ctx.fill();
  ctx.fillStyle = '#e74c3c';
  ctx.fillText('解一 (AB左侧)', legendX + 12, legendY + 4 + ls);

  ctx.beginPath(); ctx.arc(legendX + 4, legendY + 4 + ls * 2, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#f39c12'; ctx.fill();
  ctx.fillStyle = '#f39c12';
  ctx.fillText('解二 (AB右侧)', legendX + 12, legendY + 4 + ls * 2);

  ctx.beginPath(); ctx.moveTo(legendX, legendY + 4 + ls * 3);
  ctx.lineTo(legendX + 20, legendY + 4 + ls * 3);
  ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#333';
  ctx.fillText('基线 AB', legendX + 24, legendY + 4 + ls * 3);

  // By Lvmyth AI
  ctx.fillStyle = 'rgba(150,150,150,0.6)';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  ctx.fillText('By Lvmyth AI', w - 10, h - 10);

  // ── Zoom controls (右上角) ──
  var zx=w-150,zy=4,zw=142,zh=30;
  ctx.fillStyle='rgba(255,255,255,0.9)';ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=1;ctx.roundRect(zx,zy,zw,zh,5);ctx.fill();ctx.stroke();
  ctx.fillStyle='#555';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';var btnY=zy+15;
  ctx.fillText('+',zx+16,btnY);ctx.fillText('−',zx+108,btnY);ctx.fillText('↺',zx+130,btnY);
  ctx.font='10px sans-serif';ctx.fillStyle='#444';ctx.textAlign='center';ctx.fillText((zoom*100).toFixed(0)+'%',zx+64,btnY);
}

function randomExample() {
  const xa = 0, ya = 0;
  const xb = 80 + Math.random() * 70;
  const yb = -30 + Math.random() * 60;
  const xp = 30 + Math.random() * 90;
  const yp = 40 + Math.random() * 80;
  const d_ap = Math.hypot(xp - xa, yp - ya);
  const d_bp = Math.hypot(xp - xb, yp - yb);

  document.getElementById('xa').value = xa.toFixed(2);
  document.getElementById('ya').value = ya.toFixed(2);
  document.getElementById('xb').value = xb.toFixed(2);
  document.getElementById('yb').value = yb.toFixed(2);
  document.getElementById('dap').value = d_ap.toFixed(2);
  document.getElementById('dbp').value = d_bp.toFixed(2);
  calculate();
}

// 窗口尺寸变化
window.addEventListener('resize', resizeCanvas);

// ─── 画布缩放 (滚轮 + 点击 +/-/↺) ───
(function(){
  var cvs=canvas;
  cvs.addEventListener('wheel',function(e){
    e.preventDefault();
    zoom*=e.deltaY<0?1.15:0.87;
    if(zoom<0.1)zoom=0.1;if(zoom>20)zoom=20;
    draw();
  },{passive:false});
  cvs.addEventListener('click',function(e){
    var rect=cvs.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
    var w=rect.width;
    var zx=w-150,zy=4,zw=142,zh=30;
    if(x>zx&&x<zx+zw&&y>zy&&y<zy+zh){
      var bx=x-zx;
      if(bx<32){zoom*=1.3;if(zoom>20)zoom=20;draw()}
      else if(bx>98&&bx<122){zoom/=1.3;if(zoom<0.1)zoom=0.1;draw()}
      else if(bx>122){zoom=1;draw()}
    }
  });
})();

// 初始加载
window.addEventListener('load', function() {
  resizeCanvas();
  randomExample();
  renderHist();
});
