<div class="container" style="background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('hi',this)">视线高法 (单站)</button>
        <button class="tab-btn" onclick="switchTab('route',this)">多站水准路线 (转站)</button>
    </div>

    <!-- ===================== 视线高法 ===================== -->
    <div id="tab-hi" class="tab-content active">
        <h2>视线高法</h2>
        <div class="note" style="margin-bottom: 20px;">
            适用场景：仪器架设一次，测量或放样多个点。
        </div>

        <!-- 核心：视线高 -->
        <div class="hi-display-box">
            <div class="hi-label">视线高 (HI = BM + BS)</div>
            <div class="hi-value" id="hi-val">— . — — —</div>
        </div>

        <div class="input-group row">
            <div class="col">
                <label>已知点高程 (BM)</label>
                <input type="number" id="hi-bm" step="0.001" placeholder="例如: 10.000">
            </div>
            <div class="col">
                <label>后视读数 (BS)</label>
                <input type="number" id="hi-bs" step="0.001" placeholder="例如: 1.500">
            </div>
        </div>

        <div class="hi-workspace">
            <!-- 正算：求高程 -->
            <div class="card">
                <h3>正算: 求高程</h3>
                <div class="input-group">
                    <label>前视读数 (FS)</label>
                    <input type="number" id="hi-fs" step="0.001" placeholder="尺上读数">
                </div>
                <div style="text-align: center;">
                    <label>测得高程</label>
                    <div class="result-highlight" id="hi-res-elev">—</div>
                </div>
            </div>

            <!-- 反算：求读数 -->
            <div class="card">
                <h3>反算: 求读数</h3>
                <div class="input-group">
                    <label>设计高程</label>
                    <input type="number" id="hi-design" step="0.001" placeholder="目标标高">
                </div>
                <div style="text-align: center;">
                    <label>应读前视</label>
                    <div class="result-highlight" id="hi-res-fs">—</div>
                    <div id="hi-warn" class="warning">⚠️ 结果为负，需倒尺</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===================== 多站水准路线 ===================== -->
    <div id="tab-route" class="tab-content">
        <h2>多站水准路线计算</h2>
        
        <div class="route-control">
            <div>
                <label style="margin:0;">起点 A 高程 (HA):</label>
            </div>
            <div style="flex:1;">
                <input type="number" id="route-start-elev" step="0.001" value="10.000" oninput="updateAllElevations()">
            </div>
            <div style="font-size:0.85rem; color:var(--text-light);">
                提示：第一列“点名”可直接点击修改
            </div>
        </div>

        <div class="table-container">
            <table id="route-table">
                <thead>
                    <tr>
                        <th width="15%">点名/测站</th>
                        <th width="15%">后视 (BS)</th>
                        <th width="15%">前视 (FS)</th>
                        <th width="15%">本站高差</th>
                        <th width="20%">点高程 (H)</th>
                        <th width="10%">操作</th>
                    </tr>
                </thead>
                <tbody id="route-tbody">
                    <!-- Javascript will populate rows here -->
                </tbody>
            </table>
        </div>

        <div class="route-actions">
            <button class="btn-add" onclick="addStation()">+ 添加下一测站</button>
            <button class="btn-reset" onclick="resetRoute()">重置所有</button>
        </div>

        <div class="summary-panel">
            <div class="summary-card">
                <div class="note">累计后视</div>
                <div class="summary-val" id="sum-bs">0.000</div>
            </div>
            <div class="summary-card">
                <div class="note">累计前视</div>
                <div class="summary-val" id="sum-fs">0.000</div>
            </div>
            <div class="summary-card" style="background: var(--bg); border-color: var(--border);">
                <div class="note">终点 B 高程</div>
                <div class="summary-val val-success" id="final-elev">10.000</div>
            </div>
        </div>
    </div>
</div>

<script>
    // ====== 数据持久化 ======
    function saveElevData() {
      localStorage.setItem('elevData', JSON.stringify({
        bm: document.getElementById('hi-bm').value,
        bs: document.getElementById('hi-bs').value,
        fs: document.getElementById('hi-fs').value,
        design: document.getElementById('hi-design').value,
        stations: stations,
        startElev: document.getElementById('route-start-elev').value
      }));
    }
    function loadElevData() {
      var d = localStorage.getItem('elevData');
      if (d) try {
        d = JSON.parse(d);
        if (d.bm !== undefined) document.getElementById('hi-bm').value = d.bm;
        if (d.bs !== undefined) document.getElementById('hi-bs').value = d.bs;
        if (d.fs !== undefined) document.getElementById('hi-fs').value = d.fs;
        if (d.design !== undefined) document.getElementById('hi-design').value = d.design;
        if (d.stations) stations = d.stations;
        if (d.startElev) document.getElementById('route-start-elev').value = d.startElev;
      } catch(e) {}
    }

    // --- 标签切换逻辑 ---
    function switchTab(tabId, el) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        if (el) el.classList.add('active');
    }

    // ==========================================
    // 模块 1: 视线高法逻辑
    // ==========================================
    function calcHI() {
        const bm = parseFloat(document.getElementById('hi-bm').value);
        const bs = parseFloat(document.getElementById('hi-bs').value);
        
        saveElevData();
        if (isNaN(bm) || isNaN(bs)) {
            document.getElementById('hi-val').innerText = "— . — — —";
            document.getElementById('hi-res-elev').innerText = "—";
            document.getElementById('hi-res-fs').innerText = "—";
            document.getElementById('hi-warn').style.display = 'none';
            return;
        }

        const hi = bm + bs;
        document.getElementById('hi-val').innerText = hi.toFixed(3);

        // 正算
        const fs = parseFloat(document.getElementById('hi-fs').value);
        if (!isNaN(fs)) {
            document.getElementById('hi-res-elev').innerText = (hi - fs).toFixed(3);
        } else {
            document.getElementById('hi-res-elev').innerText = "—";
        }

        // 反算
        const design = parseFloat(document.getElementById('hi-design').value);
        if (!isNaN(design)) {
            const reqFs = hi - design;
            document.getElementById('hi-res-fs').innerText = reqFs.toFixed(3);
            document.getElementById('hi-warn').style.display = reqFs < 0 ? 'block' : 'none';
            document.getElementById('hi-res-fs').style.color = reqFs < 0 ? '#e74c3c' : 'var(--primary)';
        } else {
            document.getElementById('hi-res-fs').innerText = "—";
            document.getElementById('hi-warn').style.display = 'none';
        }
    }

    ['hi-bm', 'hi-bs', 'hi-fs', 'hi-design'].forEach(id => {
        document.getElementById(id).addEventListener('input', calcHI);
    });


    // ==========================================
    // 模块 2: 多站水准路线逻辑
    // ==========================================
    // 数据结构现在包含 name 字段
    let stations = [
        { name: 'TP1', bs: '', fs: '' },
        { name: 'TP2', bs: '', fs: '' },
        { name: 'TP3', bs: '', fs: '' }
    ];

    function renderRouteTable() {
        const tbody = document.getElementById('route-tbody');
        tbody.innerHTML = '';

        stations.forEach((station, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <input type="text" 
                           class="station-name-input" 
                           value="${station.name}" 
                           placeholder="点名" 
                           oninput="updateStation(${index}, 'name', this.value)">
                </td>
                <td><input type="number" step="0.001" placeholder="BS" value="${station.bs}" oninput="updateStation(${index}, 'bs', this.value)"></td>
                <td><input type="number" step="0.001" placeholder="FS" value="${station.fs}" oninput="updateStation(${index}, 'fs', this.value)"></td>
                <td id="dh-cell-${index}">—</td>
                <td id="elev-cell-${index}" class="elev-result">—</td>
                <td><button class="btn-del" onclick="removeStation(${index})" title="删除">&times;</button></td>
            `;
            tbody.appendChild(tr);
        });
        
        updateAllElevations();
    }

    function updateStation(index, field, value) {
        stations[index][field] = value;
        updateAllElevations();
        saveElevData();
    }

    function updateAllElevations() {
        saveElevData();
        const startElev = parseFloat(document.getElementById('route-start-elev').value) || 0;
        let currentElev = startElev;
        
        let sumBS = 0;
        let sumFS = 0;
        let chainBroken = false;

        stations.forEach((station, index) => {
            const bs = parseFloat(station.bs);
            const fs = parseFloat(station.fs);

            const dhCell = document.getElementById(`dh-cell-${index}`);
            const elevCell = document.getElementById(`elev-cell-${index}`);
            
            if (!isNaN(bs)) sumBS += bs;
            if (!isNaN(fs)) sumFS += fs;

            if (!chainBroken) {
                if (!isNaN(bs) && !isNaN(fs)) {
                    const dh = bs - fs;
                    currentElev += dh;
                    
                    let dhText = dh.toFixed(3);
                    if (dh > 0) { dhText = '+' + dhText; dhCell.className = 'diff-up'; }
                    else if (dh < 0) { dhCell.className = 'diff-down'; }
                    else { dhCell.className = ''; }
                    dhCell.textContent = dhText;

                    elevCell.textContent = currentElev.toFixed(3);
                    elevCell.style.color = 'var(--primary)';
                } else {
                    dhCell.textContent = '—';
                    dhCell.className = '';
                    elevCell.textContent = '—';
                    elevCell.style.color = 'var(--text-muted)';
                    chainBroken = true;
                }
            } else {
                dhCell.textContent = '—';
                dhCell.className = '';
                elevCell.textContent = '—';
                elevCell.style.color = 'var(--text-muted)';
            }
        });

        const finalElev = startElev + sumBS - sumFS;
        document.getElementById('sum-bs').textContent = sumBS.toFixed(3);
        document.getElementById('sum-fs').textContent = sumFS.toFixed(3);
        document.getElementById('final-elev').textContent = finalElev.toFixed(3);
    }

    function addStation() {
        // 自动生成下一个默认名称
        let nextNum = stations.length + 1;
        stations.push({ name: 'TP' + nextNum, bs: '', fs: '' });
        renderRouteTable();
        saveElevData();
        // 聚焦到新行的 BS 输入框
        setTimeout(() => {
            const inputs = document.querySelectorAll('#route-tbody input[type="number"]');
            if(inputs.length > 0) inputs[inputs.length - 2].focus();
        }, 50);
    }

    function removeStation(index) {
        if (stations.length <= 1) { alert("至少保留一个测站"); return; }
        if(confirm("确定删除测站 " + (stations[index].name || index + 1) + " 吗？")) {
            stations.splice(index, 1);
            renderRouteTable();
            saveElevData();
        }
    }

    function resetRoute() {
        if(confirm("确定清空？")) {
            stations = [{ name: 'TP1', bs: '', fs: '' }];
            document.getElementById('route-start-elev').value = "10.000";
            renderRouteTable();
            saveElevData();
        }
    }

    // 初始化多站表格
    loadElevData();
    renderRouteTable();
    calcHI();
</script>

</body>
</html>
