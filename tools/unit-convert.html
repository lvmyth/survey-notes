<body>
<canvas id="particleCanvas"></canvas>
<script src="../navbar.js"></script>
<div class="container">

<div class="card">
<div class="group"><h3>单位换算</h3>
<div class="row">
<label>类别</label>
<select id="cat" class="select-w" onchange="switchCat()">
<option value="length">长度</option>
<option value="area">面积</option>
<option value="volume">体积</option>
<option value="weight">重量</option>
<option value="time">时间</option>
<option value="temp">温度</option>
</select>
</div>
<div class="row">
<input id="val" type="number" value="100" step="any">
<select id="fromUnit" class="select-w"></select>
<button class="btn orange" onclick="swapUnits()" title="交换单位" style="padding:6px 10px;font-size:16px;line-height:1">⇄</button>
<select id="toUnit" class="select-w"></select>
<button class="btn" onclick="convert()">换算</button>
</div>
<div class="res"><span class="val" id="result">—</span><button class="cpy" onclick="cpyRes()">📋</button></div>
</div>
</div>

<!-- 快捷按钮 -->
<div class="card">
<div class="group"><h3>常用换算</h3>
<div class="shortcuts" id="shortcuts"></div>
</div>
</div>

<!-- 换算记录 -->
<div class="card">
<div class="group"><h3>换算记录 <span style="font-weight:normal;font-size:12px;color:#999" id="logCount"></span></h3>
<div id="logList" style="max-height:300px;overflow-y:auto;font-size:13px;font-family:Consolas,monospace;color:#333"></div>
<div style="text-align:right;margin-top:4px"><button onclick="clearLog()" style="font-size:11px;background:none;border:none;color:#999;cursor:pointer">清空记录</button></div>
</div>
</div>
<div style="text-align:center;padding:1.5rem 0 2rem;border-top:1px solid var(--border);margin-top:1rem;color:var(--text-light);font-size:0.85rem">
  <a href="mailto:lvmyth@qq.com" style="color:var(--text-light);text-decoration:none">By Lvmyth AI</a>
</div>
</div>

<script>
// 单位库
var DATA = {
  length: {base:'m', keys:['km','m','dm','cm','mm','里','丈','尺','寸','mile(英里)','yard(码)','foot(英尺)','inch(英寸)','海里'],
           vals:[1000,1,0.1,0.01,0.001,500,10/3,1/3,1/30,1609.344,0.9144,0.3048,0.0254,1852]},
  area:   {base:'m²',keys:['km²','公顷','亩','公亩','m²','dm²','cm²','mm²','mile²(平方英里)','acre(英亩)','yard²(平方码)','foot²(平方英尺)','inch²(平方英寸)','分','厘'],
           vals:[1e6,10000,2000/3,100,1,0.01,1e-4,1e-6,2589988.11,4046.856,0.836127,0.092903,0.00064516,2000/30,2000/300]},
  volume: {base:'m³',keys:['m³','dm³','cm³','mm³','L','mL','yard³(立方码)','foot³(立方英尺)','inch³(立方英寸)','gal(US)','gal(UK)','bbl(桶)'],
           vals:[1,0.001,1e-6,1e-9,0.001,1e-6,0.764555,0.0283168,1.63871e-5,0.00378541,0.00454609,0.158987]},
  weight: {base:'kg',keys:['t(吨)','kg','g','mg','斤','两','钱','担','ton(美吨)','uk_ton(英吨)','lb(磅)','oz(盎司)'],
           vals:[1000,1,0.001,1e-6,0.5,0.05,0.005,50,907.185,1016.05,0.453592,0.0283495]},
  time:   {base:'秒',keys:['年','月(30天)','天','时','分','秒','毫秒','周'],
           vals:[31536000,2592000,86400,3600,60,1,0.001,604800]},
  temp:   {base:'°C',keys:['°C(摄氏度)','°F(华氏度)','K(开尔文)','°Ré(列氏度)'],isTemp:true}
};

var shortcutsMap = {
  length:[['m→km','m','km'],['km→mile','km','mile(英里)'],['m→尺','m','尺'],['里→km','里','km'],['m→foot','m','foot(英尺)'],['海里→m','海里','m']],
  area:  [['m²→亩','m²','亩'],['亩→m²','亩','m²'],['公顷→亩','公顷','亩'],['km²→亩','km²','亩'],['m²→acre','m²','acre(英亩)'],['亩→公顷','亩','公顷']],
  volume:[['m³→L','m³','L'],['L→m³','L','m³'],['m³→bbl','m³','bbl(桶)'],['L→gal(US)','L','gal(US)'],['L→mL','L','mL']],
  weight:[['kg→斤','kg','斤'],['斤→kg','斤','kg'],['kg→lb','kg','lb(磅)'],['t→kg','t(吨)','kg'],['t→斤','t(吨)','斤']],
  time:  [['天→时','天','时'],['时→分','时','分'],['分→秒','分','秒'],['天→分','天','分'],['年→天','年','天']],
  temp:  [['°C→°F','°C(摄氏度)','°F(华氏度)'],['°F→°C','°F(华氏度)','°C(摄氏度)'],['°C→K','°C(摄氏度)','K(开尔文)'],['K→°C','K(开尔文)','°C(摄氏度)']]
};

var _initDone=false;

function switchCat(){
  var cat=document.getElementById('cat').value,data=DATA[cat];
  var fromS=document.getElementById('fromUnit'),toS=document.getElementById('toUnit');
  fromS.innerHTML='';toS.innerHTML='';
  for(var i=0;i<data.keys.length;i++){
    fromS.innerHTML+='<option value="'+i+'">'+data.keys[i]+'</option>';
    toS.innerHTML+='<option value="'+i+'">'+data.keys[i]+'</option>';
  }
  toS.selectedIndex=Math.min(1,data.keys.length-1);
  buildShortcuts(cat);
}

function buildShortcuts(cat){
  var list=shortcutsMap[cat]||[],el=document.getElementById('shortcuts');
  el.innerHTML='';
  for(var i=0;i<list.length;i++){
    var btn=document.createElement('button');
    btn.textContent=list[i][0];
    btn.onclick=function(f,t){return function(){
      var cat=document.getElementById('cat').value,data=DATA[cat];
      var fi=data.keys.indexOf(f),ti=data.keys.indexOf(t);
      if(fi>=0)document.getElementById('fromUnit').value=fi;
      if(ti>=0)document.getElementById('toUnit').value=ti;
      convert();
    }}(list[i][1],list[i][2]);
    el.appendChild(btn);
  }
}

function swapUnits(){
  var a=document.getElementById('fromUnit'),b=document.getElementById('toUnit');
  var tmp=a.value;a.value=b.value;b.value=tmp;
  convert();
}

function convert(){
  var cat=document.getElementById('cat').value,data=DATA[cat];
  var val=parseFloat(document.getElementById('val').value)||0;
  var fi=parseInt(document.getElementById('fromUnit').value);
  var ti=parseInt(document.getElementById('toUnit').value);
  var fromKey=data.keys[fi],toKey=data.keys[ti],result;

  if(data.isTemp){
    // 温度公式转换
    var celsius;
    if(fromKey==='°C(摄氏度)') celsius=val;
    else if(fromKey==='°F(华氏度)') celsius=(val-32)*5/9;
    else if(fromKey==='K(开尔文)') celsius=val-273.15;
    else if(fromKey==='°Ré(列氏度)') celsius=val*5/4;
    if(toKey==='°C(摄氏度)') result=celsius;
    else if(toKey==='°F(华氏度)') result=celsius*9/5+32;
    else if(toKey==='K(开尔文)') result=celsius+273.15;
    else if(toKey==='°Ré(列氏度)') result=celsius*4/5;
  } else {
    result=val*data.vals[fi]/data.vals[ti];
  }
  document.getElementById('result').textContent=val+' '+fromKey+' = '+result.toFixed(6)+' '+toKey;
  addLog(val,fromKey,result,toKey);
}

function addLog(v,f,r,t){
  var el=document.getElementById('logList'),cnt=document.getElementById('logCount');
  var now=new Date(),ts=now.getFullYear()+'-'+(now.getMonth()+1).toString().padStart(2,'0')+'-'+now.getDate().toString().padStart(2,'0')+' '+now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0')+':'+now.getSeconds().toString().padStart(2,'0');
  var div=document.createElement('div');
  div.style.cssText='padding:3px 0;border-bottom:1px solid #f0f0f0;display:flex;align-items:center';
  div.innerHTML='<span style="flex:1">'+v+' '+f+' = <b>'+r.toFixed(6)+'</b> '+t+'</span><span style="color:#bbb;font-size:11px;width:120px;flex-shrink:0;text-align:right">'+ts+'</span>';
  el.insertBefore(div,el.firstChild);
  cnt.textContent='('+el.children.length+'条)';
  // 持久化
  var logs=JSON.parse(localStorage.getItem('ucLogs')||'[]');
  logs.unshift({v,f,r:r.toFixed(6),t,_t:ts});
  if(logs.length>200)logs=logs.slice(0,200);
  localStorage.setItem('ucLogs',JSON.stringify(logs));
}
function clearLog(){
  document.getElementById('logList').innerHTML='';
  document.getElementById('logCount').textContent='';
  localStorage.removeItem('ucLogs');
}
function restoreLogs(){
  var el=document.getElementById('logList'),cnt=document.getElementById('logCount');
  var logs=JSON.parse(localStorage.getItem('ucLogs')||'[]');
  for(var i=0;i<logs.length;i++){
    var d=logs[i];
    var div=document.createElement('div');
    div.style.cssText='padding:3px 0;border-bottom:1px solid #f0f0f0;display:flex;align-items:center';
    div.innerHTML='<span style="flex:1">'+d.v+' '+d.f+' = <b>'+d.r+'</b> '+d.t+'</span><span style="color:#bbb;font-size:11px;width:120px;flex-shrink:0;text-align:right">'+d._t+'</span>';
    el.appendChild(div);
  }
  cnt.textContent=logs.length?'('+logs.length+'条)':'';
}

function cpyRes(){navigator.clipboard.writeText(document.getElementById('result').textContent)}

// 初始化
switchCat();
restoreLogs();
</script>
<script src="../particles.js"></script>
</body>
