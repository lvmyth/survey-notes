<body>

<div class="container">

<div class="panel">
  <div class="panel-left">
      <!-- Axis Parameters -->

        </div>

        </div>
        <div class="field-row">
          <label>方位角 V：</label>
          <input id="field-V" type="text" value="45.0" style="max-width:100px;padding:5px 8px;font-size:14px;border:1px solid var(--border);border-radius:4px">
          <span class="unit">°</span>
          <span style="font-size:10px;color:var(--text-light);margin-left:4px">（度分秒=空格）</span>
        </div>
      </div>

      <!-- Measurement Point -->
      <div class="card">
        <h3>测点坐标</h3>
        <div class="field-row">
          <label>测点 X：</label>
          <input id="field-X" type="number" step="any" value="">
        </div>
        <div class="field-row">
          <label>测点 Y：</label>
          <input id="field-Y" type="number" step="any" value="">
        </div>
        <div class="btn-group">
          <button class="btn" onclick="calculate()">计算垂距</button>
          <button class="btn btn-warn" onclick="randomPoint()">随机测点</button>
          <button class="btn btn-outline" onclick="document.getElementById('field-X').value='';document.getElementById('field-Y').value=''">清空输入</button>
        </div>
      </div>

      <!-- Result -->
      <div class="card">
        <h3>计算结果</h3>
        <div id="result-big" class="result-big" style="color:#999;">H = —</div>
        <div id="result-side" style="text-align:center;margin-bottom:6px;"></div>
        <div class="result-detail">
          <table>
            <tr><td>点线距 L：</td><td id="detail-L">—</td></tr>
            <tr><td>方位角差 S：</td><td id="detail-S">—</td></tr>
            <tr><td>垂足 Xf：</td><td id="detail-fx">—</td></tr>
            <tr><td>垂足 Yf：</td><td id="detail-fy">—</td></tr>
            <tr><td>垂距 H：</td><td id="detail-H">—</td></tr>
            <tr><td>偏侧：</td><td id="detail-side">—</td></tr>
          </table>
        </div>
      </div>

      <!-- History -->
      <div class="card history-box">

<div style="text-align:center;padding:1.5rem 0 2rem;border-top:1px solid var(--border);margin-top:1rem;color:var(--text-light);font-size:0.85rem">

<script>
// ─── State ───
let calcData = null;
let zoom = 1;

// ─── 历史记录 ───
var historyKey='perpendicular_foot_history';
function getHist(){try{return JSON.parse(localStorage.getItem(historyKey))||[]}catch(e){return[]}}
function saveHist(arr){try{localStorage.setItem(historyKey,JSON.stringify(arr.slice(0,50)))}catch(e){}}
function addHist(X,Y,H){
  var arr=getHist();
  arr.unshift({X:X,Y:Y,H:H,time:new Date().toLocaleString()});
  saveHist(arr);renderHist();
}
function renderHist(){
  var arr=getHist(),el=document.getElementById('historyList');
  if(!el)return;
  if(arr.length===0){el.innerHTML='<div style="color:var(--text-light);font-size:12px;padding:8px;text-align:center">暂无记录</div>';return}
  el.innerHTML=arr.map(function(r,i){
    return'<div class="hist-item"><span class="tag">H='+r.H.toFixed(3)+'</span><span class="coord">X='+r.X.toFixed(2)+' Y='+r.Y.toFixed(2)+'</span><span style="color:var(--text-light);font-size:10px;margin-left:auto;flex-shrink:0">'+r.time+'</span><span class="del" onclick="delHist('+i+')">✕</span></div>'
  }).join('');
}
function delHist(i){var arr=getHist();arr.splice(i,1);saveHist(arr);renderHist()}
function clearHistory(){saveHist([]);renderHist()}

// ─── 角度解析 (支持度分秒空格格式) ───
function parseAngle(str){
  str=str.trim();
  if(!str)return NaN;
  if(/^-?\d+(\.\d+)?$/.test(str))return parseFloat(str);
  var p=str.replace(/[°′″'"]/g,' ').trim().split(/\s+/).map(Number);
  if(p.length>=3)return p[0]+p[1]/60+p[2]/3600;
  if(p.length===2)return p[0]+p[1]/60;
  return parseFloat(str);
}

// ─── Calculation ───
function calculate() {
  const A = parseFloat(document.getElementById('field-A').value);
  const B = parseFloat(document.getElementById('field-B').value);
  const V = parseAngle(document.getElementById('field-V').value);
  const X = parseFloat(document.getElementById('field-X').value);
  const Y = parseFloat(document.getElementById('field-Y').value);

  if (isNaN(A) || isNaN(B) || isNaN(V) || isNaN(X) || isNaN(Y)) {
    document.getElementById('result-big').textContent = 'H = —';
    document.getElementById('result-big').style.color = '#999';
    document.getElementById('result-side').innerHTML = '<span class="red">所有字段必须为数字</span>';
    return;
  }

  const V_rad = V * Math.PI / 180;
  const dX = X - A;
  const dY = Y - B;
  const L = Math.hypot(dX, dY);
  let J = Math.atan2(dY, dX);
  if (J < 0) J += 2 * Math.PI;

  const S = J - V_rad;
  const H = L * Math.sin(S);
  const proj = L * Math.cos(S);
  const Fx = A + proj * Math.cos(V_rad);
  const Fy = B + proj * Math.sin(V_rad);

  // Side determination
  let sideText, sideColor;
  if (Math.abs(H) < 0.001) {
    sideText = '点在轴线上';
    sideColor = '#4CAF50';
  } else if (S > 0) {
    sideText = '轴线左侧 (H>0)';
    sideColor = '#E53935';
  } else {
    sideText = '轴线右侧 (H<0)';
    sideColor = '#1E88E5';
  }

  // Display results
  const bigEl = document.getElementById('result-big');
  bigEl.textContent = 'H = ' + (H >= 0 ? '+' : '') + H.toFixed(6) + ' m';
  bigEl.style.color = sideColor;

  document.getElementById('result-side').innerHTML =
    '<span class="side-badge" style="background:' + sideColor + ';color:#fff;">' + sideText + '</span>';

  document.getElementById('detail-L').textContent   = L.toFixed(6) + ' m';
  document.getElementById('detail-S').textContent   = (S * 180 / Math.PI >= 0 ? '+' : '') + (S * 180 / Math.PI).toFixed(4) + '°';
  document.getElementById('detail-fx').textContent  = Fx.toFixed(6);
  document.getElementById('detail-fy').textContent  = Fy.toFixed(6);
  document.getElementById('detail-H').textContent   = (H >= 0 ? '+' : '') + H.toFixed(6) + ' m';
  document.getElementById('detail-H').style.color    = sideColor;
  document.getElementById('detail-side').textContent = sideText;
  document.getElementById('detail-side').style.color = sideColor;

  calcData = { A, B, V_rad, V, X, Y, Fx, Fy, H, L };
  drawChart();

  // Add to history
  addHist(X,Y,H);
}

// ─── Random Point ───
function randomPoint() {
  let A = parseFloat(document.getElementById('field-A').value);
  let B = parseFloat(document.getElementById('field-B').value);
  let V = parseAngle(document.getElementById('field-V').value);
  if (isNaN(A) || isNaN(B) || isNaN(V)) { A = 0; B = 0; V = 45; }
  const V_rad = V * Math.PI / 180;
  const dist = 2 + Math.random() * 18;
  const offset = (Math.random() - 0.5) * 16;
  const perp = Math.PI / 2;
  const randX = A + dist * Math.cos(V_rad) + offset * Math.cos(V_rad + perp);
  const randY = B + dist * Math.sin(V_rad) + offset * Math.sin(V_rad + perp);
  document.getElementById('field-X').value = randX.toFixed(2);
  document.getElementById('field-Y').value = randY.toFixed(2);
  calculate();
}

// ─── Canvas ───
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const wrap = canvas.parentElement;
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width  = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  drawChart();
}

let drawWidth = 0, drawHeight = 0;

function drawChart() {
  const wrap = canvas.parentElement;
  const rect = wrap.getBoundingClientRect();
  drawWidth  = rect.width;
  drawHeight = rect.height;
  ctx.clearRect(0, 0, drawWidth, drawHeight);
  if (drawWidth < 60 || drawHeight < 60) return;

  let A, B, V_rad, V, X, Y, Fx, Fy, H, L;
  if (calcData) {
    A = calcData.A; B = calcData.B; V_rad = calcData.V_rad; V = calcData.V;
    X = calcData.X; Y = calcData.Y; Fx = calcData.Fx; Fy = calcData.Fy;
    H = calcData.H; L = calcData.L;
  } else {
    A = 0; B = 0; V_rad = Math.PI / 4; V = 45; X = 5; Y = 8; Fx = 3; Fy = 3; H = 5; L = 8;
  }

  const margin = 40;
  const w = drawWidth, h = drawHeight;

  const ptsX = [A, X, Fx], ptsY = [B, Y, Fy];
  const minX = Math.min(...ptsX), maxX = Math.max(...ptsX);
  const minY = Math.min(...ptsY), maxY = Math.max(...ptsY);
  let span = Math.max(maxX - minX, maxY - minY, 5) * 1.3;
  if (span < 1) span = 10;
  const scale = Math.min((w - margin * 2) / span, (h - margin * 2) / span, 30) * zoom;
  const cx = w / 2, cy = h / 2;
  const cxW = (minX + maxX) / 2, cyW = (minY + maxY) / 2;

  function tx(vx, vy) { return cx + (vx - cxW) * scale; }
  function ty(vx, vy) { return cy - (vy - cyW) * scale; }

  // ── Grid ──
  const gridStep = Math.max(1, Math.pow(10, Math.floor(Math.log10(span / 5))));
  ctx.strokeStyle = '#f5f5f5';
  ctx.lineWidth = 1;
  for (let gx = Math.floor((cxW - span / 2) / gridStep) * gridStep; gx < cxW + span / 2; gx += gridStep) {
    const px = tx(gx, 0);
    if (px >= 0 && px <= w) { ctx.beginPath(); ctx.moveTo(px, margin); ctx.lineTo(px, h - margin); ctx.stroke(); }
  }
  for (let gy = Math.floor((cyW - span / 2) / gridStep) * gridStep; gy < cyW + span / 2; gy += gridStep) {
    const py = ty(0, gy);
    if (py >= margin && py <= h - margin) { ctx.beginPath(); ctx.moveTo(margin, py); ctx.lineTo(w - margin, py); ctx.stroke(); }
  }

  // ── Axis line (orange, wide) ──
  const axisLen = span * 0.8;
  const ax1 = tx(A - axisLen * Math.cos(V_rad), B - axisLen * Math.sin(V_rad));
  const ay1 = ty(A - axisLen * Math.cos(V_rad), B - axisLen * Math.sin(V_rad));
  const ax2 = tx(A + axisLen * Math.cos(V_rad), B + axisLen * Math.sin(V_rad));
  const ay2 = ty(A + axisLen * Math.cos(V_rad), B + axisLen * Math.sin(V_rad));
  ctx.strokeStyle = '#FF9800';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(ax1, ay1); ctx.lineTo(ax2, ay2); ctx.stroke();

  // Axis label
  const midAx = tx(A + axisLen * 0.7 * Math.cos(V_rad), B + axisLen * 0.7 * Math.sin(V_rad));
  const midAy = ty(A + axisLen * 0.7 * Math.cos(V_rad), B + axisLen * 0.7 * Math.sin(V_rad));
  ctx.font = 'bold 10px sans-serif';
  ctx.fillStyle = '#FF9800';
  ctx.textAlign = 'center';
  ctx.fillText('轴线', midAx, midAy - 12);

  // ── Known point K ──
  const akx = tx(A, B), aky = ty(A, B);
  ctx.beginPath(); ctx.arc(akx, aky, 5, 0, 2 * Math.PI);
  ctx.fillStyle = '#333'; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = '10px Consolas,sans-serif';
  ctx.fillStyle = '#333';
  ctx.textAlign = 'right';
  ctx.fillText('K(' + A.toFixed(1) + ',' + B.toFixed(1) + ')', akx - 10, aky + 14);

  // ── Foot point F (green) ──
  const fpx = tx(Fx, Fy), fpy = ty(Fx, Fy);
  ctx.beginPath(); ctx.arc(fpx, fpy, 6, 0, 2 * Math.PI);
  ctx.fillStyle = '#4CAF50'; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = 'bold 10px Consolas,sans-serif';
  ctx.fillStyle = '#4CAF50';
  ctx.textAlign = 'center';
  ctx.fillText('F(' + Fx.toFixed(2) + ',' + Fy.toFixed(2) + ')', fpx, fpy - 14);

  // ── Perpendicular dashed line (red) from P to F ──
  const px2 = tx(X, Y), py2 = ty(X, Y);
  ctx.strokeStyle = '#E53935';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);
  ctx.beginPath(); ctx.moveTo(fpx, fpy); ctx.lineTo(px2, py2); ctx.stroke();
  ctx.setLineDash([]);

  // ── Measurement point P ──
  let ptColor;
  if (Math.abs(H) < 0.001) ptColor = '#4CAF50';
  else if (H > 0) ptColor = '#E53935';
  else ptColor = '#1E88E5';

  ctx.beginPath(); ctx.arc(px2, py2, 7, 0, 2 * Math.PI);
  ctx.fillStyle = ptColor; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = 'bold 10px Consolas,sans-serif';
  ctx.fillStyle = ptColor;
  ctx.textAlign = 'left';
  ctx.fillText('P(' + X.toFixed(2) + ',' + Y.toFixed(2) + ')', px2 + 12, py2 - 8);

  // ── Known point to measurement point dashed line ──
  ctx.strokeStyle = '#90A4AE';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(akx, aky); ctx.lineTo(px2, py2); ctx.stroke();
  ctx.setLineDash([]);

  // ── H label ──
  if (Math.abs(H) > 0.01) {
    const midHx = tx((X + Fx) / 2, (Y + Fy) / 2);
    const midHy = ty((X + Fx) / 2, (Y + Fy) / 2);
    const hColor = H > 0 ? '#E53935' : '#1E88E5';
    ctx.font = 'bold 10px Consolas,sans-serif';
    ctx.fillStyle = hColor;
    ctx.textAlign = 'left';
    ctx.fillText('H=' + Math.abs(H).toFixed(3) + 'm', midHx + 8, midHy - 6);
    ctx.font = '8px sans-serif';
    const sideLabel = H > 0 ? '(轴线左侧)' : '(轴线右侧)';
    ctx.fillText(sideLabel, midHx + 8, midHy + 8);
  }

  // ── Azimuth label ──
  const aEnd = Math.atan2(Y - B, X - A);
  const midAngle = (V_rad + (aEnd >= 0 ? aEnd : aEnd + 2 * Math.PI)) / 2;
  const arcR2 = 18;
  ctx.font = '8px Consolas,sans-serif';
  ctx.fillStyle = '#FF9800';
  ctx.textAlign = 'center';
  ctx.fillText('V=' + (V_rad * 180 / Math.PI).toFixed(1) + '°',
    akx + arcR2 * 1.6 * Math.cos(midAngle),
    aky - arcR2 * 1.6 * Math.sin(midAngle) + 3);

  // ── Legend ──
  const legX = margin + 8, legY = margin + 8;
  // Axis
  ctx.strokeStyle = '#FF9800'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(legX, legY); ctx.lineTo(legX + 18, legY); ctx.stroke();
  ctx.fillStyle = '#FF9800';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('轴线', legX + 22, legY + 3);

  // Perpendicular
  ctx.strokeStyle = '#E53935'; ctx.lineWidth = 2; ctx.setLineDash([5, 3]);
  ctx.beginPath(); ctx.moveTo(legX, legY + 14); ctx.lineTo(legX + 18, legY + 14); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#E53935';
  ctx.fillText('垂距 H', legX + 22, legY + 17);

  // Foot
  ctx.beginPath(); ctx.arc(legX + 4, legY + 28, 4, 0, 2 * Math.PI);
  ctx.fillStyle = '#4CAF50'; ctx.fill();
  ctx.fillStyle = '#4CAF50';
  ctx.fillText('垂足', legX + 12, legY + 31);

  // Author
  ctx.fillStyle = 'rgba(150,150,150,0.6)';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  ctx.fillText('By Lvmyth AI', w - 10, h - 10);

  // ── Zoom controls (右上角) ──
  var zx=w-150,zy=4,zw=142,zh=30;
  ctx.fillStyle='rgba(255,255,255,0.9)';ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=1;ctx.roundRect(zx,zy,zw,zh,5);ctx.fill();ctx.stroke();
  ctx.fillStyle='#555';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';var btnY=zy+15;
  ctx.fillText('+',zx+16,btnY);ctx.fillText('−',zx+108,btnY);ctx.fillText('↺',zx+130,btnY);
  ctx.font='10px sans-serif';ctx.fillStyle='#444';ctx.textAlign='center';ctx.fillText((zoom*100).toFixed(0)+'%',zx+64,btnY);
}

window.onresize = resizeCanvas;
window.addEventListener('load', function() {
  resizeCanvas();
  renderHist();
});

// ─── 画布缩放 (滚轮 + 点击 +/-/↺) ───
(function(){
  var cvs=canvas;
  cvs.addEventListener('wheel',function(e){
    e.preventDefault();
    zoom*=e.deltaY<0?1.15:0.87;
    if(zoom<0.1)zoom=0.1;if(zoom>20)zoom=20;
    drawChart();
  },{passive:false});
  cvs.addEventListener('click',function(e){
    var rect=cvs.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
    var w=rect.width;
    var zx=w-150,zy=4,zw=142,zh=30;
    if(x>zx&&x<zx+zw&&y>zy&&y<zy+zh){
      var bx=x-zx;
      if(bx<32){zoom*=1.3;if(zoom>20)zoom=20;drawChart()}
      else if(bx>98&&bx<122){zoom/=1.3;if(zoom<0.1)zoom=0.1;drawChart()}
      else if(bx>122){zoom=1;drawChart()}
    }
  });
})();
</script>
<script src="../particles.js"></script>
