<script>
const st=[]; let type='closed', angType='right';

function setType(v){type=v;document.getElementById('typeClosed').className='tag'+(v=='closed'?' on':'');document.getElementById('typeLinked').className='tag'+(v=='linked'?' on':'');document.getElementById('linkedExtra').style.display=v=='linked'?'':'none'}
function setAng(v){angType=v;document.getElementById('angRight').className='tag'+(v=='right'?' on':'');document.getElementById('angLeft').className='tag'+(v=='left'?' on':'')}
function dms2dd(d,m,s){return d+m/60+s/3600}
function dd2dms(v){const d=Math.floor(v),mf=(v-d)*60,m=Math.floor(mf),s=(mf-m)*60;return[d,m,+s.toFixed(1)]}
function fmtDMS(v){const[d,m,s]=dd2dms(v);return d+'\u00b0'+m+'\u2032'+s.toFixed(0)+'\u2033'}
function g(id){return document.getElementById(id)}
function gv(id){return +document.getElementById(id).value}
function rSt(){g('stBody').innerHTML=st.map((s,i)=>'<tr><td>'+s.n+'</td><td>'+s.a+'</td><td>'+s.d.toFixed(3)+'</td><td class="del" onclick="delSt('+i+')">\u2715</td></tr>').join('')}

function addSt(){const n=g('inpName').value||'P'+(st.length+1),ag=g('inpAngle').value,ds=+g('inpDist').value;if(!ds||isNaN(ds))return alert('距离错误');const p=ag.replace(/[°′″']/g,' ').trim().split(/\s+/).map(Number);if(p.length<3||p.some(isNaN))return alert('角度格式：度 分 秒');const dd=dms2dd(p[0],p[1],p[2]);st.push({n,a:`${dd2dms(dd)[0]}°${dd2dms(dd)[1]}′${dd2dms(dd)[2]}″`,d:ds,_a:dd});const nn=n.charCodeAt(n.length-1)>=65&&n.charCodeAt(n.length-1)<90?String.fromCharCode(n.charCodeAt(n.length-1)+1):'P'+(st.length+1);g('inpName').value=nn;g('inpAngle').value='90 00 00';g('inpDist').value='100.000';rSt()}
function delSt(i){st.splice(i,1);rSt()}
function clearAll(){st.length=0;rSt();g('resultCard').style.display='none'}

function exportData(){
  const data={type,angleType:angType,known:{xa:g('kxa').value,ya:g('kya').value,sa_d:g('ksad').value,sa_m:g('ksam').value,sa_s:g('ksas').value,xb:g('kxb').value,yb:g('kyb').value,ea_d:g('kead').value,ea_m:g('keam').value,ea_s:g('keas').value},stations:st.map(s=>({name:s.n,angle:s.a,dist:s.d}))}
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a')
  a.href=URL.createObjectURL(blob);a.download='导线数据.json';a.click();URL.revokeObjectURL(a.href)
}
function importData(e){
  const file=e.target.files[0];if(!file)return;const reader=new FileReader()
  reader.onload=function(ev){try{const d=JSON.parse(ev.target.result)
    if(d.known){const k=d.known;g('kxa').value=k.xa||'';g('kya').value=k.ya||'';g('ksad').value=k.sa_d||'0';g('ksam').value=k.sa_m||'0';g('ksas').value=k.sa_s||'0';g('kxb').value=k.xb||'';g('kyb').value=k.yb||'';g('kead').value=k.ea_d||'0';g('keam').value=k.ea_m||'0';g('keas').value=k.ea_s||'0'}
    if(d.type)setType(d.type);if(d.angleType)setAng(d.angleType)
    st.length=0;if(d.stations){d.stations.forEach(s=>{const p=s.angle.replace(/[°′″']/g,' ').trim().split(/\s+/).map(Number),dd=p.length>=3?dms2dd(p[0],p[1],p[2]):0;st.push({n:s.name,a:s.angle,d:+s.dist,_a:dd})})}
    rSt()
  }catch(err){alert('导入失败: '+err.message)}
  e.target.value=''}
  reader.readAsText(file)
}

function loadDemo(){st.length=0
if(type=='closed'){const d=[[90,0,30,100],[89,59,30,80],[90,0,20,100],[89,59,40,80]];d.forEach((v,i)=>{const dd=dms2dd(v[0],v[1],v[2]);st.push({n:'ABCD'[i],a:fmtDMS(dd),d:v[3],_a:dd})})
}else{g('kxb').value='900.000';g('kyb').value='500.000';[[179,59,30,120],[180,0,15,150],[180,0,0,130]].forEach((v,i)=>{const dd=dms2dd(v[0],v[1],v[2]);st.push({n:'ABC'[i],a:fmtDMS(dd),d:v[3],_a:dd})})}
rSt()}

function calc(){
if(st.length<3)return alert('至少 3 个测站')
const n=st.length,isClose=type=='closed',isRight=angType=='right'
const xa=gv('kxa'),ya=gv('kya'),sa=dms2dd(gv('ksad'),gv('ksam'),gv('ksas'))
let xb=0,yb=0,ea=0
if(!isClose){xb=gv('kxb');yb=gv('kyb');ea=dms2dd(gv('kead'),gv('keam'),gv('keas'))}

// 角度闭合差
const sumA=st.reduce((s,o)=>s+o._a,0);let fBeta;
if(isClose){fBeta=sumA-(n-2)*180;if(Math.abs(fBeta*3600)>30*Math.sqrt(n))return alert('角度闭合差 '+(fBeta*3600).toFixed(1)+'" 超限')}
else{fBeta=isRight?sumA-(sa-ea+n*180):sumA-(ea-sa+n*180);while(fBeta>180)fBeta-=360;while(fBeta<-180)fBeta+=360;if(Math.abs(fBeta*3600)>40*Math.sqrt(n))return alert('角度闭合差 '+(fBeta*3600).toFixed(1)+'" 超限')}
const vBeta=-fBeta/n

// 方位角推算
let az=sa,sumDx=0,sumDy=0
const pts=[]
for(let i=0;i<n;i++){const o=st[i]
if(isRight){az=(az+180-(o._a+vBeta))%360;if(az<0)az+=360}else{az=(az+(o._a+vBeta)-180)%360;if(az<0)az+=360}
const dx=o.d*Math.cos(az*Math.PI/180),dy=o.d*Math.sin(az*Math.PI/180)
sumDx+=dx;sumDy+=dy;pts.push({n:o.n,angle:o._a+vBeta,d:o.d,az,dx,dy})}

// 闭合差
let fx,fy;if(isClose){fx=-sumDx;fy=-sumDy}else{fx=-(xa+sumDx-xb);fy=-(ya+sumDy-yb)}
const totalD=st.reduce((s,o)=>s+o.d,0),fs=Math.hypot(fx,fy)
if(totalD>0&&fs/totalD>1/2000)return alert('相对闭合差 1/'+Math.round(totalD/fs)+' 超限')

// 分配坐标闭合差
let x=xa,y=ya;const result=[]
result.push({n:st[0].n,x:+x.toFixed(3),y:+y.toFixed(3),az:+pts[0].az.toFixed(4),d:pts[0].d,ac:+pts[0].angle.toFixed(4)})
for(let i=0;i<n;i++){const p=pts[i],vx=fx*p.d/totalD,vy=fy*p.d/totalD
x+=p.dx+vx;y+=p.dy+vy
const ni=(i+1)%n,nName=isClose?st[ni].n:(i<n-1?st[i+1].n:'终')
let aDisp,dDisp,aCorr
if(i<n-1){aDisp=+pts[ni].az.toFixed(4);dDisp=pts[ni].d;aCorr=+pts[ni].angle.toFixed(4)}
else{aDisp=isClose?null:+pts[i].az.toFixed(4);dDisp=p.d;aCorr=isClose?null:+pts[i].angle.toFixed(4)}
result.push({n:nName,x:+x.toFixed(3),y:+y.toFixed(3),az:aDisp,d:dDisp,ac:aCorr})}

// 显示
const lines='f\u03b2='+(fBeta*3600).toFixed(1)+'"\u00a0\u00a0v\u03b2='+(vBeta*3600).toFixed(1)+'"\nfx='+fx.toFixed(3)+'\u00a0fy='+fy.toFixed(3)+'\u00a0fs='+fs.toFixed(3)+'m\n\u03a3D='+totalD.toFixed(3)+'m\u00a0\u00a0K=1/'+(totalD>0&&fs>0?Math.round(totalD/fs):'\u2014')
g('resTitle').textContent=(isClose?'闭合':'附合')+'导线\u00a0平差结果'
g('resSummary').textContent=lines
let ht='<tr><th>点号</th><th>改正后角度</th><th>X</th><th>Y</th><th>方位角</th><th>距离</th></tr>'
result.forEach(r=>{ht+='<tr><td>'+r.n+'</td><td>'+(r.ac!==null?fmtDMS(r.ac):'\u2014')+'</td><td>'+r.x.toFixed(3)+'</td><td>'+r.y.toFixed(3)+'</td><td>'+(r.az!==null?fmtDMS(r.az):'\u95ed\u5408')+'</td><td>'+(typeof r.d=='number'?r.d.toFixed(3):r.d)+'</td></tr>'})
g('resTbl').innerHTML=ht
g('resultCard').style.display='block'
drawPlot(result)}

function drawPlot(pts){
const c=g('c'),rect=c.parentElement.getBoundingClientRect(),w=rect.width,dpr=window.devicePixelRatio||1
c.width=w*dpr;c.height=300*dpr;c.style.width=w+'px';c.style.height='300px'
const ctx=c.getContext('2d');ctx.scale(dpr,dpr);const h=300
ctx.clearRect(0,0,w,h)
if(!pts||pts.length<2)return
const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),xM=Math.min(...xs),xX=Math.max(...xs),yM=Math.min(...ys),yX=Math.max(...ys)
const sp=Math.max(xX-xM,yX-yM,1)*1.2,cx=(xM+xX)/2,cy=(yM+yX)/2,mr=40,sc=Math.min((w-2*mr)/sp,(h-2*mr)/sp,80)
const tx=v=>mr+(v-cx)*sc+w/2-mr-sp/2*sc,ty=v=>h-mr-(v-cy)*sc-h/2+mr+sp/2*sc
const tx2=v=>mr+(v-xM)/(xX-xM+0.001)*(w-2*mr),ty2=v=>h-mr-(v-yM)/(yX-yM+0.001)*(h-2*mr)

ctx.strokeStyle='#2c6e49';ctx.lineWidth=2.5;ctx.beginPath()
pts.forEach((p,i)=>{const px=tx2(p.x),py=ty2(p.y);i===0?ctx.moveTo(px,py):ctx.lineTo(px,py)});ctx.stroke()
if(type=='closed'&&pts.length>=3){ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(tx2(pts[pts.length-1].x),ty2(pts[pts.length-1].y));ctx.lineTo(tx2(pts[0].x),ty2(pts[0].y));ctx.stroke();ctx.setLineDash([])}
pts.forEach((p,i)=>{
const px=tx2(p.x),py=ty2(p.y);ctx.fillStyle='#e74c3c';ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()
ctx.fillStyle='#333';ctx.font='8px Consolas,sans-serif';ctx.textAlign=px<w/2?'left':'right';ctx.textBaseline='bottom';ctx.fillText(p.n+'\n('+p.x.toFixed(2)+','+p.y.toFixed(2)+')',px+(px<w/2?8:-8),py-6)})
ctx.fillStyle='#bdbdbd';ctx.font='8px sans-serif';ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillText('By Lvmyth AI',w-5,h-5)}
</script>
