<script>
// ============ 核心数学与计算逻辑 ============

function parseAngle(val) {
  val = val.trim();
  if (val.includes(' ') || val.includes('°') || val.includes('′') || val.includes('″')) {
    var parts = val.replace(/[°′″']/g, ' ').split(/\s+/).filter(s => s.length > 0);
    var d = parseFloat(parts[0]) || 0;
    var m = parseFloat(parts[1]) || 0;
    var s = parseFloat(parts[2]) || 0;
    return d + m / 60 + s / 3600;
  }
  return parseFloat(val) || 0;
}
function normAng(a) { a = a % 360; if (a < 0) a += 360; return a; }
function fmtAng(deg) {
  var d = Math.floor(deg);
  var mf = (deg - d) * 60;
  var m = Math.floor(mf);
  var s = (mf - m) * 60;
  return d + '°' + m + '′' + s.toFixed(1) + '″';
}

// 椭圆弧长计算与均匀采样
function getEllipsePoints(a, b, N, mode) {
  if (mode === 'angle') {
    var pts = [];
    for (var i = 0; i <= N; i++) {
      var alpha = (i / N) * Math.PI / 2;
      pts.push({ alpha: alpha, u: b * Math.cos(alpha), v: a * Math.sin(alpha) });
    }
    return pts;
  } else {
    var steps = 1000;
    var dAlpha = (Math.PI / 2) / steps;
    var cumArcs = [0];
    var alphas = [0];
    var totalLen = 0;
    
    for (var i = 0; i < steps; i++) {
      var a1 = i * dAlpha;
      var a2 = (i + 1) * dAlpha;
      var f1 = Math.sqrt(b * b * Math.sin(a1) * Math.sin(a1) + a * a * Math.cos(a1) * Math.cos(a1));
      var f2 = Math.sqrt(b * b * Math.sin(a2) * Math.sin(a2) + a * a * Math.cos(a2) * Math.cos(a2));
      totalLen += (f1 + f2) / 2 * dAlpha;
      cumArcs.push(totalLen);
      alphas.push(a2);
    }
    
    var segLen = totalLen / N;
    var pts = [];
    for (var j = 0; j <= N; j++) {
      var targetArc = j * segLen;
      var lo = 0, hi = cumArcs.length - 1;
      while (lo < hi) {
        var mid = Math.floor((lo + hi) / 2);
        if (cumArcs[mid] < targetArc) lo = mid + 1;
        else hi = mid;
      }
      var alpha = alphas[lo];
      pts.push({ alpha: alpha, u: b * Math.cos(alpha), v: a * Math.sin(alpha) });
    }
    return pts;
  }
}

function toggleRoadInput() {
  var useRoad = document.getElementById('calcFromRoad').checked;
  document.getElementById('directInput').style.display = useRoad ? 'none' : '';
  document.getElementById('roadInput').style.display = useRoad ? '' : 'none';
}

function updateHeight() {
  var hTop = parseFloat(document.getElementById('hTop').value) || 0;
  var hGround = parseFloat(document.getElementById('hGround').value) || 0;
  var H = hTop - hGround;
  var varH = parseFloat(document.getElementById('varHeight').value) || 6;
  document.getElementById('hDiff').textContent = H.toFixed(2) + ' m';
  var tag = document.getElementById('slopeTag');
  if (H > varH) {
    tag.className = 'tag-variable';
    tag.textContent = '变坡(H>' + varH + 'm)';
    document.getElementById('varSlopeSection').style.display = '';
  } else {
    tag.className = 'tag-normal';
    tag.textContent = '单坡';
    document.getElementById('varSlopeSection').style.display = 'none';
  }
}

function setVals(obj) { for (var id in obj) { var el = document.getElementById(id); if (el) el.value = obj[id]; } }

function loadExample(type) {
  if (type === 'ortho') {
    setVals({hTop:'10.50', hGround:'5.50', varHeight:'6.00', aTop:'3.00', bTop:'0.75', n1:'1.50', m1:'1.25', skewAngle:'0', coneSide:'left', sampleMode:'arc', x0:'500000', y0:'3000000', az:'90', segments:'10'});
  } else if (type === 'var') {
    setVals({hTop:'13.60', hGround:'5.50', varHeight:'6.00', aTop:'3.60', bTop:'0.75', n1:'1.50', m1:'1.25', n2:'1.75', m2:'1.50', skewAngle:'0', coneSide:'left', sampleMode:'arc', x0:'500000', y0:'3000000', az:'90', segments:'12'});
  } else if (type === 'skew') {
    setVals({hTop:'10.50', hGround:'5.50', varHeight:'6.00', aTop:'3.00', bTop:'0.75', n1:'1.50', m1:'1.25', skewAngle:'30', skewDir:'left-skew', coneSide:'left', sampleMode:'arc', x0:'500000', y0:'3000000', az:'90', segments:'10'});
  }
  document.getElementById('calcFromRoad').checked = false;
  toggleRoadInput();
  updateHeight();
  calculate();
}

var calcResult = null;

function calculate() {
  var hTop = parseFloat(document.getElementById('hTop').value) || 0;
  var hGround = parseFloat(document.getElementById('hGround').value) || 0;
  var H = hTop - hGround;
  if (H <= 0) { alert('高差H必须大于0！'); return; }

  var varH = parseFloat(document.getElementById('varHeight').value) || 6;
  var useRoad = document.getElementById('calcFromRoad').checked;
  var forceRuled = document.getElementById('forceRuled').checked;
  var n1 = parseFloat(document.getElementById('n1').value) || 1;
  var m1 = parseFloat(document.getElementById('m1').value) || 1.5;
  var n2 = parseFloat(document.getElementById('n2').value) || 1.75;
  var m2 = parseFloat(document.getElementById('m2').value) || 1.5;
  
  var aTop, bTop;
  if (useRoad) {
    var roadHW = parseFloat(document.getElementById('roadHalfW').value) || 12.25;
    var bridgeHW = parseFloat(document.getElementById('bridgeHalfW').value) || 10.25;
    bTop = Math.max(0.75, parseFloat(document.getElementById('bTop2').value) || 0.75);
    aTop = roadHW - bridgeHW;  // a' = 路基半宽 - 桥台半宽
    if (forceRuled) { aTop = bTop * (n1 / m1); }  // 直纹面约束时用比例覆盖
  } else {
    bTop = parseFloat(document.getElementById('bTop').value) || 0.75;
    if (bTop < 0.75) bTop = 0.75;
    aTop = parseFloat(document.getElementById('aTop').value) || 0;
    if (forceRuled) {
      aTop = bTop * (n1 / m1);
      document.getElementById('aTop').value = aTop.toFixed(2);
    }
  }

  var skewDeg = parseFloat(document.getElementById('skewAngle').value) || 0;
  var side = document.getElementById('coneSide').value;
  var skewDir = document.getElementById('skewDir').value;
  var sampleMode = document.getElementById('sampleMode').value;
  var N = Math.min(200, Math.max(3, parseInt(document.getElementById('segments').value) || 10));
  var X0 = parseFloat(document.getElementById('x0').value) || 0;
  var Y0 = parseFloat(document.getElementById('y0').value) || 0;
  var azDeg = parseAngle(document.getElementById('az').value);

  var isVarSlope = H > varH;
  var aBot, bBot, aMid = 0, bMid = 0;
  
  if (!isVarSlope) {
    aBot = aTop + n1 * H;
    bBot = bTop + m1 * H;
  } else {
    aMid = aTop + n1 * varH;
    bMid = bTop + m1 * varH;
    if (forceRuled) {
      var bBot_calc = bMid + m2 * (H - varH);
      var aBot_calc = bBot_calc * (n2 / m2);
      aBot = aBot_calc;
      bBot = bBot_calc;
    } else {
      aBot = aMid + n2 * (H - varH);
      bBot = bMid + m2 * (H - varH);
    }
  }

  var rawPoints = getEllipsePoints(aBot, bBot, N, sampleMode);
  var points = [];
  var skewRad = skewDeg * Math.PI / 180;
  var sign = (skewDir === 'left-skew') ? 1 : -1;
  var dirX_deg = (side === 'left') ? normAng(azDeg - 90) : normAng(azDeg + 90);
  var dirY_deg = normAng(azDeg + 180);
  var dirX_rad = dirX_deg * Math.PI / 180;
  var dirY_rad = dirY_deg * Math.PI / 180;

  for (var i = 0; i < rawPoints.length; i++) {
    var p = rawPoints[i];
    var x_route, y_route;
    if (skewDeg === 0) {
      x_route = p.u; y_route = p.v;
    } else {
      x_route = p.u * Math.cos(sign * skewRad) - p.v * Math.sin(sign * skewRad);
      y_route = p.u * Math.sin(sign * skewRad) + p.v * Math.cos(sign * skewRad);
    }
    var Xf = X0 + x_route * Math.cos(dirX_rad) + y_route * Math.cos(dirY_rad);
    var Yf = Y0 + x_route * Math.sin(dirX_rad) + y_route * Math.sin(dirY_rad);
    points.push({
      idx: i, alphaDeg: (p.alpha * 180 / Math.PI).toFixed(2),
      u: p.u, v: p.v, x_route: x_route, y_route: y_route,
      X: Xf.toFixed(3), Y: Yf.toFixed(3), dist: Math.sqrt(p.u*p.u + p.v*p.v).toFixed(3)
    });
  }

  calcResult = {
    H, hTop, hGround, varH, isVarSlope, forceRuled,
    aTop, bTop, aBot, bBot, aMid, bMid, n1, m1, n2, m2,
    skewDeg, side, skewDir, sampleMode, azDeg, X0, Y0, points, N,
    dirX_deg, dirY_deg
  };

  showSummary();
  showPlanView();
  showSideView();
  showCoordTable();
}

function showSummary() {
  var r = calcResult;
  var s = '━━━ 锥坡几何参数 ━━━\n';
  s += '高差 H = ' + r.H.toFixed(2) + ' m  [' + (r.isVarSlope ? '变坡>H=' + r.varH + 'm' : '单坡') + ']\n';
  s += "顶面 a' = " + r.aTop.toFixed(3) + "m,  b' = " + r.bTop.toFixed(3) + "m\n";
  if (r.isVarSlope) {
    s += '变坡点 a_m = ' + r.aMid.toFixed(3) + 'm,  b_m = ' + r.bMid.toFixed(3) + 'm\n';
    s += '  (上半 ' + r.varH + 'm: 1:' + r.n1 + '/1:' + r.m1 + ' | 下半 ' + (r.H - r.varH).toFixed(2) + 'm: 1:' + r.n2 + '/1:' + r.m2 + ')\n';
  } else {
    s += '  (坡率 1:' + r.n1 + '(纵) / 1:' + r.m1 + '(横))\n';
  }
  s += '底面 a = ' + r.aBot.toFixed(3) + 'm,  b = ' + r.bBot.toFixed(3) + 'm\n';
  if (r.forceRuled) s += '✅ 已全段强制直纹面约束\n\n'; else s += '\n';
  s += '━━━ 坐标转换参数 ━━━\n';
  s += '锥顶坐标 X = ' + r.X0.toFixed(3) + ', Y = ' + r.Y0.toFixed(3) + '\n';
  s += '路线方位角 = ' + fmtAng(r.azDeg) + '\n';
  s += '采样方式 = ' + (r.sampleMode === 'arc' ? '按弧长均匀 (高精度)' : '按角度均匀') + '\n';
  if (r.skewDeg > 0) s += '斜交角 θ = ' + r.skewDeg + '° (仿射变换生效)\n';
  document.getElementById('summaryBox').textContent = s;
  document.getElementById('summaryCard').style.display = '';
  // 精度标签：检查直纹面约束一致性
  var tag = document.getElementById('precisionTag');
  if (r.isVarSlope && !r.forceRuled) {
    var ratioTop = r.aTop / r.bTop, ratioBot = r.aBot / r.bBot;
    if (Math.abs(ratioTop - ratioBot) > 0.05) {
      tag.textContent = '⚠️ 变坡非直纹面，轴比不一致';
      tag.style.color = '#e65100';
    } else {
      tag.textContent = '✅ 精度正常';
      tag.style.color = '#28a745';
    }
  } else {
    tag.textContent = r.forceRuled ? '✅ 直纹面约束，轴比一致' : '✅ 精度正常';
    tag.style.color = '#28a745';
  }
}

function showPlanView() {
  var r = calcResult;
  document.getElementById('planCard').style.display = '';
  var canvas = document.getElementById('planCanvas');
  var w = canvas.parentElement.clientWidth - 2;
  if (w < 100) w = 600;
  var h = 450;
  canvas.width = w * 2; canvas.height = h * 2; canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  var ctx = canvas.getContext('2d'); ctx.scale(2, 2); ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#fafafa'; ctx.fillRect(0, 0, w, h);

  var cosSk = Math.abs(Math.cos(r.skewDeg * Math.PI / 180));
  var sinSk = Math.abs(Math.sin(r.skewDeg * Math.PI / 180));
  var maxX = Math.max(r.bBot * cosSk + r.aBot * sinSk, r.aBot, r.bBot);
  var maxY = Math.max(r.bBot * sinSk + r.aBot * cosSk, r.aBot, r.bBot);

  var margin = 60;
  var scale = Math.min((w - margin * 2) / (maxX * 1.2), (h - margin * 2) / (maxY * 1.2));
  var ox = margin + 30, oy = h - margin - 20;

  ctx.strokeStyle = '#bbb'; ctx.lineWidth = 1; ctx.setLineDash([6, 4]);
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox, margin); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(w - margin, oy); ctx.stroke();
  if (r.skewDeg > 0) {
    var sign = (r.skewDir === 'left-skew') ? 1 : -1;
    var ang = -sign * r.skewDeg * Math.PI / 180;
    ctx.strokeStyle = '#e65100'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + Math.cos(ang) * (w-margin-ox) * 0.8, oy + Math.sin(ang) * (w-margin-ox) * 0.8); ctx.stroke();
    ctx.beginPath(); ctx.arc(ox, oy, 30, 0, ang, ang > 0); ctx.stroke();
    ctx.fillStyle = '#e65100'; ctx.font = '12px sans-serif'; ctx.fillText('θ=' + r.skewDeg + '°', ox + 35, oy - 8);
  }
  ctx.setLineDash([]);

  function drawEllipse(a, b, color, dash, width, fill) {
    ctx.strokeStyle = color; ctx.lineWidth = width || 1; ctx.setLineDash(dash || []);
    ctx.beginPath();
    for (var t = 0; t <= Math.PI / 2 + 0.01; t += 0.02) {
      var u = b * Math.cos(t), v = a * Math.sin(t);
      var x_r = u, y_r = v;
      if (r.skewDeg > 0) {
        var s = (r.skewDir === 'left-skew') ? 1 : -1;
        var rad = s * r.skewDeg * Math.PI / 180;
        x_r = u * Math.cos(rad) - v * Math.sin(rad);
        y_r = u * Math.sin(rad) + v * Math.cos(rad);
      }
      var px = ox + x_r * scale, py = oy - y_r * scale;
      if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    ctx.stroke(); ctx.setLineDash([]);
  }

  drawEllipse(r.aTop, r.bTop, '#4c956c', [3, 3], 1);
  if (r.isVarSlope) drawEllipse(r.aMid, r.bMid, '#e65100', [5, 3], 1);
  drawEllipse(r.aBot, r.bBot, '#2c6e49', [], 2, 'rgba(44,110,73,0.06)');

  ctx.fillStyle = '#2c6e49';
  for (var i = 0; i < r.points.length; i++) {
    var p = r.points[i];
    var px = ox + p.x_route * scale, py = oy - p.y_route * scale;
    ctx.beginPath(); ctx.arc(px, py, 3.5, 0, Math.PI * 2); ctx.fill();
    if (i % Math.ceil(r.N / 8) === 0 || i === r.points.length - 1) {
      ctx.fillStyle = '#1b4d2e'; ctx.font = '11px Consolas'; ctx.textAlign = 'left';
      ctx.fillText(i, px + 6, py - 6); ctx.fillStyle = '#2c6e49';
    }
  }
  
  ctx.fillStyle = '#d32f2f'; ctx.beginPath(); ctx.arc(ox, oy, 5, 0, Math.PI * 2); ctx.fill();
  ctx.font = '12px sans-serif'; ctx.fillStyle = '#d32f2f'; ctx.fillText('锥顶(0,0)', ox + 8, oy + 4);
  
  ctx.font = '11px sans-serif'; ctx.fillStyle = '#555';
  ctx.strokeStyle = '#2c6e49'; ctx.lineWidth = 2; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(15, 20); ctx.lineTo(35, 20); ctx.stroke();
  ctx.fillText('━ 坡脚', 40, 24);
  ctx.strokeStyle = '#4c956c'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(15, 36); ctx.lineTo(35, 36); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillText('┄ 顶面', 40, 40);
  ctx.fillStyle = '#999'; ctx.fillText('比例 1:' + (1 / scale).toFixed(2), ox, h - 8);
}

function showSideView() {
  var r = calcResult;
  document.getElementById('sideCard').style.display = '';
  var canvas = document.getElementById('sideCanvas');
  var w = canvas.parentElement.clientWidth - 2;
  if (w < 100) w = 600;
  var h = 220;
  canvas.width = w * 2; canvas.height = h * 2; canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  var ctx = canvas.getContext('2d'); ctx.scale(2, 2); ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#fafafa'; ctx.fillRect(0, 0, w, h);

  var margin = 35, groundY = h - 35, halfW = w / 2, plotH = groundY - margin, plotW = halfW - margin * 2;
  
  function drawProfile(ox, maxW, aTop, aMid, aBot, H, varH, n1, n2, title) {
    var scaleX = plotW / (maxW * 1.15), scaleY = plotH / (H * 1.15), scale = Math.min(scaleX, scaleY);
    ctx.strokeStyle = '#999'; ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(ox, groundY); ctx.lineTo(ox + plotW, groundY); ctx.stroke(); ctx.setLineDash([]);

    var topX = ox + aTop * scale, topY = groundY - H * scale;
    var footX = ox + aBot * scale;
    
    if (r.isVarSlope) {
      var midX = ox + aMid * scale, midY = groundY - varH * scale;
      ctx.strokeStyle = '#2c6e49'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(topX, topY); ctx.lineTo(midX, midY); ctx.stroke();
      ctx.strokeStyle = '#e65100'; ctx.beginPath(); ctx.moveTo(midX, midY); ctx.lineTo(footX, groundY); ctx.stroke();
      ctx.fillStyle = '#e65100'; ctx.beginPath(); ctx.arc(midX, midY, 4, 0, Math.PI * 2); ctx.fill();
      ctx.font = '10px sans-serif'; ctx.fillStyle = '#e65100'; ctx.fillText('变坡', midX + 5, midY - 5);
      ctx.fillStyle = '#2c6e49'; ctx.fillText('1:' + n1, (topX + midX) / 2, (topY + midY) / 2 - 8);
      ctx.fillStyle = '#e65100'; ctx.fillText('1:' + n2, (midX + footX) / 2, (midY + groundY) / 2 - 8);
    } else {
      ctx.strokeStyle = '#2c6e49'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(topX, topY); ctx.lineTo(footX, groundY); ctx.stroke();
      ctx.font = '11px sans-serif'; ctx.fillStyle = '#2c6e49'; ctx.fillText('1:' + n1, (topX + footX) / 2 + 10, (topY + groundY) / 2 - 8);
    }
    ctx.fillStyle = '#d32f2f'; ctx.beginPath(); ctx.arc(topX, topY, 4, 0, Math.PI * 2); ctx.fill();
    ctx.font = '12px sans-serif'; ctx.fillStyle = '#333'; ctx.textAlign = 'center'; ctx.fillText(title, (ox + footX) / 2, 18);
    ctx.font = '10px Consolas'; ctx.fillStyle = '#666'; ctx.textAlign = 'right'; ctx.fillText('H=' + H.toFixed(1) + 'm', ox - 3, (topY + groundY) / 2);
  }

  drawProfile(margin, r.aBot, r.aTop, r.aMid, r.aBot, r.H, r.varH, r.n1, r.n2, '纵向剖面 (1:n)');
  ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(halfW, margin); ctx.lineTo(halfW, groundY); ctx.stroke(); ctx.setLineDash([]);
  drawProfile(halfW + margin, r.bBot, r.bTop, r.bMid, r.bBot, r.H, r.varH, r.m1, r.m2, '横向剖面 (1:m)');
}

function showCoordTable() {
  var r = calcResult;
  var html = '<table><tr><th>点号</th><th>角度α°</th><th>局部u(横)</th><th>局部v(纵)</th><th>全局X(北)</th><th>全局Y(东)</th><th>距锥顶</th></tr>';
  for (var i = 0; i < r.points.length; i++) {
    var p = r.points[i];
    html += '<tr><td>' + i + '</td><td>' + p.alphaDeg + '</td><td>' + p.u.toFixed(3) + '</td><td>' + p.v.toFixed(3) + '</td><td>' + p.X + '</td><td>' + p.Y + '</td><td>' + p.dist + '</td></tr>';
  }
  html += '</table>';
  document.getElementById('coordTableWrap').innerHTML = html;
  document.getElementById('tableCard').style.display = '';
  toggleCoordTable(false);
}

function toggleCoordTable(forceShow) {
  var wrap = document.getElementById('coordTableWrap');
  var icon = document.getElementById('toggleIcon');
  if (!wrap || !icon) return;
  var show = (forceShow !== undefined) ? forceShow : (wrap.style.display !== 'block');
  wrap.style.display = show ? 'block' : 'none';
  icon.textContent = show ? '▼ 收起' : '▶ 展开';
}
function exportCSV() {
  if (!calcResult) return;
  var r = calcResult;
  var lines = ['\uFEFF点号,椭圆角α(度),局部u(横向),局部v(纵向),全局X(北),全局Y(东),距锥顶'];
  for (var i = 0; i < r.points.length; i++) {
    var p = r.points[i];
    lines.push([i, p.alphaDeg, p.u.toFixed(3), p.v.toFixed(3), p.X, p.Y, p.dist].join(','));
  }
  var blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  var link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = '锥坡放样坐标表.csv';
  link.click();
}

function copyCoords() {
  if (!calcResult) return;
  var r = calcResult;
  var text = '';
  for (var i = 0; i < r.points.length; i++) {
    var p = r.points[i];
    text += i + '  X=' + p.X + '  Y=' + p.Y + '  α=' + p.alphaDeg + '°\n';
  }
  navigator.clipboard.writeText(text).then(() => alert('坐标已复制!')).catch(() => {
    var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert('坐标已复制!');
  });
}

['hTop', 'hGround', 'varHeight'].forEach(id => document.getElementById(id).addEventListener('input', updateHeight));
window.addEventListener('resize', function() { if (calcResult) { showPlanView(); showSideView(); } });

updateHeight();
calculate();
