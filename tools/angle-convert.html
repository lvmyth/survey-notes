<style>
#particleCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;background:#f5f7f0}
body{padding-top:64px;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;display:flex;flex-direction:column}
.navbar,.container{position:relative;z-index:1}
.container{max-width:600px;margin:0 auto;padding:1rem;flex:1;width:100%;box-sizing:border-box}
.card{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card h3{font-size:14px;color:var(--primary-dark);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.conv-box{display:flex;align-items:center;gap:4px;margin-bottom:6px;flex-wrap:nowrap}
.conv-box input{flex:1;min-width:0;padding:5px 6px;border:1px solid var(--border);border-radius:5px;font-size:13px;font-family:'Consolas',monospace;text-align:center;background:#fff;outline:none}
.conv-box input:focus{border-color:var(--primary)}
.conv-box input.sm{flex:0 0 60px}
.conv-box input.s{flex:0 0 60px}
#inp{width:auto;flex:0 0 110px}
.conv-box .sym{font-size:14px;font-weight:bold;color:var(--text-light);flex-shrink:0}
.res-row{display:flex;align-items:center;gap:8px;background:#f8faf5;border-radius:6px;padding:10px 12px;margin-top:4px}
.res-row .lbl{font-size:12px;color:var(--text-light);white-space:nowrap}
.res-row .val{font-size:20px;font-weight:bold;color:var(--primary);font-family:'Consolas',monospace;flex:1;text-align:center}
.cpy-btn{font-size:14px;background:var(--primary-light);color:#fff;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;transition:opacity .2s;flex-shrink:0}
.cpy-btn:hover{opacity:.85}
.sub{margin-top:18px}
.history-box{margin-top:18px}
.history-box h3{font-size:13px;color:var(--primary-dark);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.history-box h3 button{font-size:11px;background:none;border:1px solid var(--border);border-radius:4px;padding:3px 8px;cursor:pointer;color:var(--text-light)}
.history-box h3 button:hover{background:var(--primary-light);color:#fff;border-color:var(--primary-light)}
.hist-item{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:12px;font-family:'Consolas',monospace;border-bottom:1px solid var(--border)}

@media(max-width:600px){.navbar{padding:0 0.8rem !important}.navbar-inner{height:52px !important}.navbar .logo{font-size:1rem !important}.navbar .logo img{height:24px !important;margin-right:4px !important}.nav-links a{padding:6px 8px !important;font-size:0.8rem !important}}

@media(max-width:480px){

.res-row .val{font-size:15px}

<body>
<canvas id="particleCanvas"></canvas>

<div class="container">
<div class="card">
  <h3>度分秒 → 十进制度</h3>
  <div class="conv-box"><input class="sm" id="d" type="number" value="30"><span class="sym">°</span>
    <input class="sm" id="m" type="number" value="15"><span class="sym">′</span>
    <input class="s" id="s" type="number" value="30" step="0.1"><span class="sym">″</span>
    <button class="cpy-btn" onclick="dms2dd()" style="flex:0 0 auto;padding:5px 14px;font-size:13px">换算</button></div>
  <div class="res-row"><span class="lbl">十进制度</span><span class="val" id="dd">30.258333</span>
    <button class="cpy-btn" onclick="cpy('dd')">📋</button></div>
</div>
<div class="card sub">
  <h3>十进制度 → 度分秒</h3>
  <div class="conv-box"><input id="inp" type="number" value="30.25833" step="any"><span class="sym">°</span>
    <button class="cpy-btn" onclick="dd2dms()" style="flex:0 0 auto;padding:5px 14px;font-size:13px">换算</button></div>
  <div class="res-row" style="font-size:16px"><span class="lbl">度分秒</span>
    <span class="val" id="dms" style="font-size:16px">30°15′30.0″</span>
    <button class="cpy-btn" onclick="cpy2('dms')">📋</button></div>
</div>
<div class="card sub">
  <h3>十进制度 → 弧度</h3>
  <div class="conv-box"><input id="inp2" type="number" value="30.25833" step="any" style="flex:0 0 120px"><span class="sym">°</span>
    <button class="cpy-btn" onclick="deg2rad()" style="flex:0 0 auto;padding:5px 14px;font-size:13px">换算</button></div>
  <div class="res-row"><span class="lbl">弧度</span><span class="val" id="deg2rad_res">0.5281</span>
    <button class="cpy-btn" onclick="cpy('deg2rad_res')">📋</button></div>
</div>
<div class="card sub">
  <h3>弧度 → 十进制度</h3>
  <div class="conv-box"><input id="inp3" type="number" value="0.5281" step="any" style="flex:0 0 120px"><span class="sym">rad</span>
    <button class="cpy-btn" onclick="rad2deg()" style="flex:0 0 auto;padding:5px 14px;font-size:13px">换算</button></div>
  <div class="res-row"><span class="lbl">十进制度</span><span class="val" id="rad2deg_res">30.2583</span><span class="sym">°</span>
    <button class="cpy-btn" onclick="cpy('rad2deg_res')">📋</button></div>
</div>
<div class="card history-box">
  <h3>📋 换算记录 <button onclick="clearHistory()">清空记录</button></h3>
  <div id="historyList"></div>
</div>
<div style="text-align:center;padding:1.5rem 0 2rem;border-top:1px solid var(--border);margin-top:1rem;color:var(--text-light);font-size:0.85rem">
  <a href="mailto:lvmyth@qq.com" style="color:var(--text-light);text-decoration:none">By Lvmyth AI</a>
</div>
</div>
<script>
var historyKey='angle_convert_history';
function getHist(){try{return JSON.parse(localStorage.getItem(historyKey))||[]}catch(e){return[]}}
function saveHist(arr){try{localStorage.setItem(historyKey,JSON.stringify(arr.slice(0,50)))}catch(e){}}
function addHist(type,input,output){
  var arr=getHist();
  arr.unshift({type:type,input:input,output:output,time:new Date().toLocaleString()});
  saveHist(arr);renderHist();
}
function renderHist(){
  var arr=getHist(),el=document.getElementById('historyList');
  if(arr.length===0){el.innerHTML='<div style="color:var(--text-light);font-size:12px;padding:8px;text-align:center">暂无记录</div>';return}
  el.innerHTML=arr.map(function(r,i){var t=r.type,label={dms2dd:'DMS→DD',dd2dms:'DD→DMS',deg2rad:'°→rad',rad2deg:'rad→°'}[t]||t;return'<div class="hist-item"><span class="tag">'+label+'</span><span>'+r.input+' → '+r.output+'</span><span style="color:var(--text-light);font-size:10px;margin-left:auto">'+r.time+'</span><span class="del" onclick="delHist('+i+')">✕</span></div>'}).join('');
}
function delHist(i){var arr=getHist();arr.splice(i,1);saveHist(arr);renderHist()}
function clearHistory(){saveHist([]);renderHist()}
function dms2dd(){
  var d=+document.getElementById('d').value||0,m=+document.getElementById('m').value||0,s=+document.getElementById('s').value||0;
  var result=(d+m/60+s/3600).toFixed(6);
  document.getElementById('dd').textContent=result;
  addHist('dms2dd',d+'°'+m+'′'+s+'″',result+'°');
}
function dd2dms(){
  var v=+document.getElementById('inp').value||0,d=Math.floor(v),mf=(v-d)*60,m=Math.floor(mf),s=(mf-m)*60;
  var dms=d+'\u00b0'+m+'\u2032'+s.toFixed(1)+'\u2033';
  document.getElementById('dms').textContent=dms;
  document.getElementById('d').value=d;
  document.getElementById('m').value=m;
  document.getElementById('s').value=s.toFixed(1);
  addHist('dd2dms',v+'°',dms);
}
function cpy(id){navigator.clipboard.writeText(document.getElementById(id).textContent)}
function cpy2(id){navigator.clipboard.writeText(document.getElementById(id).textContent)}
function deg2rad(){var v=+document.getElementById('inp2').value||0,r=v*Math.PI/180;document.getElementById('deg2rad_res').textContent=r.toFixed(6);addHist('deg2rad',v+'°',r.toFixed(6)+' rad')}
function rad2deg(){var v=+document.getElementById('inp3').value||0,d=v*180/Math.PI;document.getElementById('rad2deg_res').textContent=d.toFixed(6);addHist('rad2deg',v+' rad',d.toFixed(6)+'°')}
renderHist();
// 粒子背景
var c=document.getElementById('particleCanvas'),x=c.getContext('2d');var W,H,ps=[],m={x:-9999,y:-9999};var CF={count:120,speed:0.25,cDist:110,mR:160};
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}
class P{constructor(){this.rr()}rr(){this.x=Math.random()*W;this.y=Math.random()*H;this.vx=(Math.random()-0.5)*CF.speed*2;this.vy=(Math.random()-0.5)*CF.speed*2;this.r=Math.random()*1.8+0.6}up(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>W)this.vx*=-1;if(this.y<0||this.y>H)this.vy*=-1}dr(){x.beginPath();x.arc(this.x,this.y,this.r,0,Math.PI*2);x.fillStyle='rgba(44,110,73,0.35)';x.fill()}}
function ln(){var dS=CF.cDist*CF.cDist;for(var i=0;i<ps.length;i++)for(var j=i+1;j<ps.length;j++){var dx=ps[i].x-ps[j].x,dy=ps[i].y-ps[j].y,d2=dx*dx+dy*dy;if(d2<dS){var a=(1-d2/dS)*0.4;x.beginPath();x.moveTo(ps[i].x,ps[i].y);x.lineTo(ps[j].x,ps[j].y);x.strokeStyle='rgba(44,110,73,'+a.toFixed(3)+')';x.lineWidth=0.5;x.stroke()}}if(m.x>0){var mR2=CF.mR*CF.mR;for(var i=0;i<ps.length;i++){var dx=ps[i].x-m.x,dy=ps[i].y-m.y,d2=dx*dx+dy*dy;if(d2<mR2){var a=(1-d2/mR2)*0.7;x.beginPath();x.moveTo(ps[i].x,ps[i].y);x.lineTo(m.x,m.y);x.strokeStyle='rgba(76,150,108,'+a.toFixed(3)+')';x.lineWidth=1;x.stroke()}}}}
function an(){x.clearRect(0,0,W,H);for(var i=0;i<ps.length;i++){ps[i].up();ps[i].dr()}ln();requestAnimationFrame(an)}
rs();for(var i=0;i<CF.count;i++)ps.push(new P());
addEventListener('resize',function(){rs();for(var i=0;i<ps.length;i++){ps[i].x=Math.random()*W;ps[i].y=Math.random()*H}});
addEventListener('mousemove',function(e){m.x=e.clientX;m.y=e.clientY});
addEventListener('mouseleave',function(){m.x=-9999;m.y=-9999});
addEventListener('touchmove',function(e){var t=e.touches[0];if(t){m.x=t.clientX;m.y=t.clientY}},{passive:true});
addEventListener('touchend',function(){m.x=-9999;m.y=-9999});
an();

</script>
<script src="../navbar.js"></script>
<script src="../particles.js"></script>
</body>
</html>
